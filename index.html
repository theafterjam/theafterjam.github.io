<script>
// backingTrack.js — Drum and bass synthesis for The After Jam
//
// Reads from globals defined in song-editor-browser.html:
//   rhythm, drumVolume, bassVolume, bassMode, playbackBPM, playbackIndex,
//   playbackElements, playbackBeatInChord, playbackBeatInMeasure, drumSubBeat,
//   formMap, formRepeatCount, currentPass, chordAnalysis, chordToPlayIndex
//
// Exposes: playDrumBeat(), playBass(), resetBackingTrack(), isLastChord(),
//          getAudioBus()

let drumMeasureCount = 0;
let walkingBassApproachDir = 1;
let walkingBassSkipNext = false;
let lastWalkingMidi = 40;
let walkingChordPlan = null;
let walkingDirection = -1;
const BASS_LOW = 28;
const BASS_HIGH = 52;

let drumBus = null, bassBus = null, clickBus = null;

function getAudioBus(type) {
  const ctx = getAudioCtx();
  if (type === 'drum' && !drumBus) { drumBus = ctx.createGain(); drumBus.gain.value = drumVolume; drumBus.connect(ctx.destination); }
  if (type === 'bass' && !bassBus) { bassBus = ctx.createGain(); bassBus.gain.value = bassVolume; bassBus.connect(ctx.destination); }
  if (type === 'click' && !clickBus) { clickBus = ctx.createGain(); clickBus.gain.value = clickVolume; clickBus.connect(ctx.destination); }
  return { drum: drumBus, bass: bassBus, click: clickBus }[type];
}

function resetBackingTrack() {
  drumSubBeat = 0;
  drumMeasureCount = 0;
  walkingBassApproachDir = 1;
  walkingBassSkipNext = false;
  lastWalkingMidi = 40;
  walkingChordPlan = null;
  walkingDirection = -1;
}

function isLastChord() {
  if (!formMap || formMap.formStart === null) {
    return playbackIndex === playbackElements.length - 1;
  }

  if (currentPass >= formRepeatCount && formMap.codaStart !== null) {
    return playbackIndex === formMap.codaEnd;
  }

  const onLastFormPass = (currentPass >= formRepeatCount - 1);
  if (!onLastFormPass) return false;

  if (formMap.codaStart === null) {
    if (formMap.codaJumpIndex !== null) {
      return playbackIndex === formMap.codaJumpIndex - 1;
    }
    return playbackIndex === formMap.formEnd;
  }

  return false;
}

// --- Drum synthesis ---

const DRUM_PATTERNS = {
  swing: [
    { kick: true, ride: true },
    {},
    { kick: true, hat: true, ride: true },
    { ride: true },
    { kick: true, ride: true },
    {},
    { kick: true, hat: true, ride: true },
    { ride: true },
  ],
  bossa: [
    { ride: true, kick: true },
    { ride: true },
    { ride: true, hat: true },
    { ride: true, kick: true },
    { ride: true, kick: true },
    { ride: true },
    { ride: true, hat: true },
    { ride: true, kick: true },
  ]
};

function playKick(ctx, time, soft) {
  const dest = getAudioBus('drum');
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(dest);
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(30, time + 0.1);
  const vol = soft ? 0.06 : 0.7;
  gain.gain.setValueAtTime(vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc.start(time); osc.stop(time + 0.15);
}

function playRide(ctx, time) {
  const dest = getAudioBus('drum');
  const dur = 0.5;
  const bufSize = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 4000;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 11000;
  const washGain = ctx.createGain();
  noise.connect(hp); hp.connect(lp); lp.connect(washGain); washGain.connect(dest);
  washGain.gain.setValueAtTime(0.07, time);
  washGain.gain.exponentialRampToValueAtTime(0.004, time + dur);
  noise.start(time); noise.stop(time + dur);
  const partials = [3400, 4500, 5500, 7100];
  for (const freq of partials) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain();
    osc.connect(g); g.connect(dest);
    g.gain.setValueAtTime(0.025, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.7);
    osc.start(time); osc.stop(time + dur * 0.7);
  }
  const tickDur = 0.012;
  const tickBuf = ctx.createBuffer(1, ctx.sampleRate * tickDur, ctx.sampleRate);
  const tickData = tickBuf.getChannelData(0);
  for (let i = 0; i < tickData.length; i++) tickData[i] = Math.random() * 2 - 1;
  const tick = ctx.createBufferSource();
  tick.buffer = tickBuf;
  const tickHp = ctx.createBiquadFilter();
  tickHp.type = 'highpass';
  tickHp.frequency.value = 8000;
  const tickGain = ctx.createGain();
  tick.connect(tickHp); tickHp.connect(tickGain); tickGain.connect(dest);
  tickGain.gain.setValueAtTime(0.13, time);
  tickGain.gain.exponentialRampToValueAtTime(0.001, time + tickDur);
  tick.start(time); tick.stop(time + tickDur);
}

function playSnare(ctx, time) {
  const dest = getAudioBus('drum');
  const bufSize = ctx.sampleRate * 0.1;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const noiseGain = ctx.createGain();
  noise.connect(noiseGain); noiseGain.connect(dest);
  noiseGain.gain.setValueAtTime(0.3, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
  noise.start(time); noise.stop(time + 0.1);
  const osc = ctx.createOscillator();
  const oscGain = ctx.createGain();
  osc.connect(oscGain); oscGain.connect(dest);
  osc.frequency.value = 200;
  oscGain.gain.setValueAtTime(0.15, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  osc.start(time); osc.stop(time + 0.05);
}

function playRimshot(ctx, time) {
  const dest = getAudioBus('drum');
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(dest);
  osc.type = 'sine';
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.6, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  osc.start(time); osc.stop(time + 0.05);
  const bufSize = ctx.sampleRate * 0.02;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 2500;
  bp.Q.value = 2;
  const noiseGain = ctx.createGain();
  noise.connect(bp); bp.connect(noiseGain); noiseGain.connect(dest);
  noiseGain.gain.setValueAtTime(0.35, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.02);
  noise.start(time); noise.stop(time + 0.02);
}

function playHiHat(ctx, time, open) {
  const dest = getAudioBus('drum');
  const dur = open ? 0.08 : 0.05;
  const bufSize = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3000;
  filter.Q.value = 3;
  const gain = ctx.createGain();
  noise.connect(filter); filter.connect(gain); gain.connect(dest);
  gain.gain.setValueAtTime(open ? 0.2 : 0.18, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  noise.start(time); noise.stop(time + dur);
}

function playDrumSlot(ctx, slot, time, soft) {
  if (slot.kick) playKick(ctx, time, soft);
  if (slot.snare) playSnare(ctx, time);
  if (slot.rim) playRimshot(ctx, time);
  if (slot.hat) playHiHat(ctx, time, false);
  if (slot.ride) playRide(ctx, time);
}

function playDrumBeat() {
  if (drumVolume === 0) return;
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const beatDuration = 60 / playbackBPM;
  const isSwing = rhythm === 'swing';
  const offBeatDelay = isSwing ? beatDuration * 2 / 3 : beatDuration / 2;
  const pattern = DRUM_PATTERNS[rhythm];

  if (isLastChord() && playbackBeatInChord > 0) {
    drumSubBeat = (drumSubBeat + 2) % 8;
    if (drumSubBeat === 0) drumMeasureCount++;
    return;
  }

  const slot1 = pattern[drumSubBeat % 8];
  playDrumSlot(ctx, slot1, now, isSwing);

  const slot2 = pattern[(drumSubBeat + 1) % 8];
  playDrumSlot(ctx, slot2, now + offBeatDelay, isSwing);

  if (isSwing) {
    const accentPattern = [
      null,
      { pos: 6, off: true },
      null,
      { pos: 4, off: false },
      null,
      { pos: 6, off: true },
      { pos: 2, off: true },
      { pos: 6, off: false },
    ];
    const accent = accentPattern[drumMeasureCount % 8];
    if (accent && drumSubBeat === accent.pos) {
      const t = accent.off ? now + offBeatDelay : now;
      playSnare(ctx, t);
    }
  }

  if (!isSwing && rhythm === 'bossa') {
    const bossaPos = (drumMeasureCount % 2) * 8 + (drumSubBeat % 8);
    const rimOnSlots = new Set([0, 3, 6, 10, 13]);
    if (rimOnSlots.has(bossaPos)) playRimshot(ctx, now);
    if (rimOnSlots.has(bossaPos + 1)) playRimshot(ctx, now + offBeatDelay);
  }

  drumSubBeat = (drumSubBeat + 2) % 8;
  if (drumSubBeat === 0) drumMeasureCount++;
}

// --- Bass synthesis ---

function noteFrequency(noteIndex, octave) {
  const midi = 12 * (octave + 1) + noteIndex;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function midiFromPitchClass(pc, refMidi) {
  const refPC = ((refMidi % 12) + 12) % 12;
  let diff = pc - refPC;
  if (diff > 6) diff -= 12;
  if (diff < -6) diff += 12;
  let midi = refMidi + diff;
  if (midi < BASS_LOW) midi += 12;
  if (midi > BASS_HIGH) midi -= 12;
  return midi;
}

function planWalkingLine(rootIndex, quality, chordBeats, nextRootIndex) {
  const harmonyInfo = getHarmonyInfo();
  const scaleTones = harmonyInfo && harmonyInfo.scaleTones ? harmonyInfo.scaleTones : null;
  const chordTones = getChordTones(rootIndex, quality);
  const pattern = harmonyInfo && harmonyInfo.patternRole;

  // Beat 0: root near last note
  const startMidi = midiFromPitchClass(rootIndex, lastWalkingMidi);
  if (chordBeats === 1) return [startMidi];

  // Last beat: approach note toward next chord
  let endMidi;
  if (nextRootIndex !== null) {
    const nextRootMidi = midiFromPitchClass(nextRootIndex, startMidi + walkingDirection * (chordBeats - 1));
    // Approach from below when ascending, from above when descending
    if (nextRootMidi >= startMidi) {
      endMidi = nextRootMidi - 1; // half step below target
    } else {
      endMidi = nextRootMidi + 1; // half step above target
    }
  } else {
    const fifthPC = getFifth(rootIndex, quality);
    endMidi = midiFromPitchClass(fifthPC, startMidi + walkingDirection * 2);
  }

  if (chordBeats === 2) {
    updateWalkingDirection(endMidi);
    return [startMidi, endMidi];
  }

  // 4-beat chords: specific jazz walking patterns

  // For long chords (8+), split into two arcs
  if (chordBeats >= 8) {
    const midBeat = Math.floor(chordBeats / 2);
    const midTarget = midiFromPitchClass(getFifth(rootIndex, quality), startMidi + walkingDirection * 3);
    const firstHalf = interpolateArc(startMidi, midTarget, midBeat, scaleTones, chordTones, pattern, 0);
    const secondHalf = interpolateArc(midTarget, endMidi, chordBeats - midBeat, scaleTones, chordTones, pattern, midBeat);
    const plan = firstHalf.concat(secondHalf.slice(1));
    while (plan.length < chordBeats) plan.push(endMidi);
    updateWalkingDirection(plan[plan.length - 1]);
    return plan.slice(0, chordBeats);
  }

  // Standard: interpolate from start to end across middle beats
  const plan = interpolateArc(startMidi, endMidi, chordBeats, scaleTones, chordTones, pattern, 0);
  updateWalkingDirection(plan[plan.length - 1]);
  return plan;
}

function interpolateArc(startMidi, endMidi, numBeats, scaleTones, chordTones, pattern, beatOffset) {
  const plan = [startMidi];
  if (numBeats <= 1) return plan;
  if (numBeats === 2) { plan.push(endMidi); return plan; }

  // Fixed endpoints: fill only the middle beats, then append endMidi
  const middleCount = numBeats - 2;
  for (let i = 1; i <= middleCount; i++) {
    const t = i / (middleCount + 1);
    const idealMidi = Math.round(startMidi + (endMidi - startMidi) * t);
    const prevMidi = plan[i - 1];
    const isBeforeEnd = (i === middleCount);

    let patternTarget = null;
    const beatPos = beatOffset + i;
    if (beatPos === 1 && pattern === 'ii') patternTarget = getFifth(plan[0] % 12, null);
    if (beatPos === 1 && pattern === 'V') patternTarget = chordTones.length > 1 ? chordTones[1] : null;

    let bestNote = idealMidi;
    let bestScore = -Infinity;
    const towardEnd = Math.sign(endMidi - prevMidi);

    for (let candidate = idealMidi - 3; candidate <= idealMidi + 3; candidate++) {
      if (candidate < BASS_LOW || candidate > BASS_HIGH) continue;
      if (candidate === prevMidi) continue;
      if (candidate === endMidi) continue; // don't arrive at end early
      const step = Math.abs(candidate - prevMidi);
      if (step > 3) continue;

      let score = 0;
      const pc = ((candidate % 12) + 12) % 12;

      if (step === 1) score += 2;
      else if (step === 2) score += 3;
      else score += 1;

      if (scaleTones && scaleTones.includes(pc)) score += 3;
      if (chordTones.includes(pc) && (beatPos % 2 === 0 || beatPos === 1)) score += 3;
      const dir = Math.sign(candidate - prevMidi);
      if (towardEnd !== 0) {
        if (dir === towardEnd) score += 2;
        else score -= 3;
      }
      if (patternTarget !== null && pc === patternTarget) score += 2;

      // Chromatic passing: half step from endMidi on the beat before arrival
      if (isBeforeEnd && Math.abs(candidate - endMidi) === 1) {
        const between = towardEnd > 0
          ? (candidate > prevMidi && candidate < endMidi)
          : (candidate < prevMidi && candidate > endMidi);
        if (between) score += 3;
      }

      if (score > bestScore) { bestScore = score; bestNote = candidate; }
    }

    plan.push(bestNote);
  }

  plan.push(endMidi);
  return plan;
}

function updateWalkingDirection(lastMidi) {
  if (lastMidi >= BASS_HIGH - 3) { walkingDirection = -1; return; }
  if (lastMidi <= BASS_LOW + 3) { walkingDirection = 1; return; }
  walkingDirection = Math.random() < 0.7 ? -walkingDirection : walkingDirection;
}

function getWalkingMidi(rootIndex, quality, chordBeats) {
  if (playbackBeatInChord === 0 || !walkingChordPlan) {
    const nextRoot = getNextChordRoot();
    walkingChordPlan = planWalkingLine(rootIndex, quality, chordBeats, nextRoot);
  }
  const midi = walkingChordPlan[Math.min(playbackBeatInChord, walkingChordPlan.length - 1)];
  lastWalkingMidi = midi;
  return midi;
}

function getFifth(rootIndex, quality) {
  const flat5 = quality && (quality.includes('dim') || quality.includes('b5'));
  return (rootIndex + (flat5 ? 6 : 7)) % 12;
}

function getChordTones(rootIndex, quality) {
  let intervals = [0, 4, 7];
  if (quality.includes('dim') || quality.includes('m7b5')) {
    intervals = [0, 3, 6, 10];
  } else if (quality.includes('aug') || quality.includes('#5')) {
    intervals = [0, 4, 8];
  } else if (quality.startsWith('m') && !quality.startsWith('maj')) {
    intervals = [0, 3, 7];
    if (quality.includes('7')) intervals.push(10);
  } else {
    if (quality.includes('maj7')) intervals.push(11);
    else if (quality.includes('7') || quality.includes('9') || quality.includes('13')) intervals.push(10);
  }
  return intervals.map(i => (rootIndex + i) % 12);
}

function getNextChordRoot() {
  if (playbackIndex + 1 >= playbackElements.length) return null;
  const next = playbackElements[playbackIndex + 1];
  const name = next.element.querySelector('.chord, .chord-chart-label')?.textContent
    || next.element.textContent.trim();
  const parsed = ChordLibrary.parseChord(name);
  return parsed ? parsed.rootIndex : null;
}

function getLogicalChordIndex() {
  for (let i = 0; i < chordToPlayIndex.length; i++) {
    if (chordToPlayIndex[i] === playbackIndex) return i;
    if (chordToPlayIndex[i] > playbackIndex) return Math.max(0, i - 1);
  }
  return chordToPlayIndex.length - 1;
}

function getHarmonyInfo() {
  if (!chordAnalysis || chordAnalysis.length === 0) return null;
  const logIdx = getLogicalChordIndex();
  return chordAnalysis[logIdx] || null;
}

function chromaticApproach(targetIndex) {
  const note = ((targetIndex + walkingBassApproachDir) % 12 + 12) % 12;
  walkingBassApproachDir *= -1;
  return note;
}

function pickApproachNote(targetIndex, harmonyInfo) {
  if (harmonyInfo && harmonyInfo.voiceLeading && harmonyInfo.voiceLeading.approachTones.length > 0) {
    const tones = harmonyInfo.voiceLeading.approachTones;
    const pick = tones[Math.floor(Math.random() * tones.length)];
    return pick;
  }
  return chromaticApproach(targetIndex);
}

function pickScalePassingTone(rootIndex, quality, beatInChord, harmonyInfo) {
  if (harmonyInfo && harmonyInfo.scaleTones) {
    const scale = harmonyInfo.scaleTones;
    const chordTones = getChordTones(rootIndex, quality);
    // Pick scale tones that aren't chord tones for variety
    const passingTones = scale.filter(n => !chordTones.includes(n));
    if (passingTones.length > 0) {
      return passingTones[(beatInChord - 1) % passingTones.length];
    }
  }
  return null;
}

function pickWalkingNote(rootIndex, quality, beatInChord, chordBeats) {
  if (beatInChord === 0) return rootIndex;

  const harmonyInfo = getHarmonyInfo();
  const tones = getChordTones(rootIndex, quality);
  const nextRoot = getNextChordRoot();
  const isTritSub = harmonyInfo && harmonyInfo.isTritoneSubstitution;
  const pattern = harmonyInfo && harmonyInfo.patternRole;

  // Last beat: approach the next chord root
  if (beatInChord === chordBeats - 1 && chordBeats > 1) {
    if (nextRoot !== null) {
      if (isTritSub) {
        // Tritone sub resolves chromatically downward
        return (rootIndex + 11) % 12;
      }
      return pickApproachNote(nextRoot, harmonyInfo);
    }
    return getFifth(rootIndex, quality);
  }

  // Pattern-specific walking lines
  if (pattern === 'ii' && chordBeats >= 2) {
    // ii chord: root, 5th, [scale tone], approach to V root
    if (beatInChord === 1) return getFifth(rootIndex, quality);
    if (beatInChord === 2) {
      const passing = pickScalePassingTone(rootIndex, quality, beatInChord, harmonyInfo);
      return passing !== null ? passing : tones.length > 2 ? tones[2] : getFifth(rootIndex, quality);
    }
  }

  if (pattern === 'V' && chordBeats >= 2) {
    // V chord: root, 3rd, [b7 or scale], leading tone to I
    if (beatInChord === 1) return tones.length > 1 ? tones[1] : getFifth(rootIndex, quality);
    if (beatInChord === 2) {
      // b7 of dom chord for strong pull toward resolution
      return tones.length > 3 ? tones[3] : (rootIndex + 10) % 12;
    }
  }

  if (pattern === 'iii' || pattern === 'VI') {
    // iii-VI: keep forward motion with chord tones and 5th
    if (beatInChord === 1) return getFifth(rootIndex, quality);
  }

  // General walking: use scale tones for middle beats on longer chords
  if (chordBeats >= 4 && harmonyInfo) {
    if (beatInChord === 1) return tones.length > 1 ? tones[1] : getFifth(rootIndex, quality);
    if (beatInChord === 2) {
      const passing = pickScalePassingTone(rootIndex, quality, beatInChord, harmonyInfo);
      if (passing !== null) return passing;
      return tones.length > 2 ? tones[2] : getFifth(rootIndex, quality);
    }
  }

  // Default: cycle through chord tones
  const middleTones = tones.slice(1);
  return middleTones[(beatInChord - 1) % middleTones.length];
}

function playBassNote(ctx, time, freq, duration) {
  const dest = getAudioBus('bass');
  const lowBoost = freq < 80 ? (80 - freq) / 40 : 0;
  const fadeOut = 0.03;
  const noteDur = duration * 0.95;

  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(dest);
  const vol1 = 0.25 - lowBoost * 0.08;
  gain.gain.setValueAtTime(vol1, time);
  gain.gain.exponentialRampToValueAtTime(vol1 * 0.2, time + noteDur - fadeOut);
  gain.gain.exponentialRampToValueAtTime(0.001, time + noteDur);
  osc.start(time); osc.stop(time + noteDur + 0.01);

  const osc2 = ctx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.value = freq * 2;
  const gain2 = ctx.createGain();
  osc2.connect(gain2); gain2.connect(dest);
  const vol2 = 0.10 + lowBoost * 0.12;
  gain2.gain.setValueAtTime(vol2, time);
  gain2.gain.exponentialRampToValueAtTime(vol2 * 0.15, time + noteDur - fadeOut);
  gain2.gain.exponentialRampToValueAtTime(0.001, time + noteDur);
  osc2.start(time); osc2.stop(time + noteDur + 0.01);

  if (lowBoost > 0.3) {
    const osc3 = ctx.createOscillator();
    osc3.type = 'triangle';
    osc3.frequency.value = freq * 3;
    const gain3 = ctx.createGain();
    osc3.connect(gain3); gain3.connect(dest);
    const vol3 = lowBoost * 0.06;
    gain3.gain.setValueAtTime(vol3, time);
    gain3.gain.exponentialRampToValueAtTime(vol3 * 0.15, time + noteDur - fadeOut);
    gain3.gain.exponentialRampToValueAtTime(0.001, time + noteDur);
    osc3.start(time); osc3.stop(time + noteDur + 0.01);
  }
}

function playSwingHeadBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay) {
  const beatInPattern = playbackBeatInChord % 4;
  const beatsLeft = chordBeats - playbackBeatInChord;
  const rootFreq = noteFrequency(rootIndex, 2);
  const fifthFreq = noteFrequency(getFifth(rootIndex, quality), 2);

  if (beatInPattern === 0) {
    const noteDur = beatsLeft <= 2 ? beatDuration * beatsLeft : beatDuration * 2;
    playBassNote(ctx, now, rootFreq, noteDur);
  } else if (beatInPattern === 1 && beatsLeft >= 2) {
    playBassNote(ctx, now + offBeatDelay, fifthFreq, beatDuration * 1.5);
  }
}

function getNextBeatTarget(rootIndex, quality, chordBeats) {
  if (walkingChordPlan && playbackBeatInChord + 1 < walkingChordPlan.length) {
    return walkingChordPlan[playbackBeatInChord + 1];
  }
  const nextRoot = getNextChordRoot();
  return nextRoot !== null ? midiFromPitchClass(nextRoot, lastWalkingMidi) : lastWalkingMidi;
}

function playSwingWalkingBass(ctx, now, rootIndex, quality, chordBeats, beatDuration) {
  if (walkingBassSkipNext) {
    walkingBassSkipNext = false;
    return;
  }

  const midiNote = getWalkingMidi(rootIndex, quality, chordBeats);
  const freq = midiToFreq(midiNote);
  const swingRatio = 0.65 + (Math.random() - 0.5) * 0.06;
  const jitter = () => (Math.random() - 0.5) * 0.024;

  const canEmbellish = playbackBeatInChord > 0 && chordBeats > 1;
  const isLastBeat = playbackBeatInChord === chordBeats - 1;

  if (canEmbellish) {
    const roll = Math.random();
    const eighthThreshold = swingEighths;
    const dottedThreshold = eighthThreshold + (isLastBeat ? 0 : swingDotted);
    const tripletThreshold = dottedThreshold + (isLastBeat ? swingTriplet : 0);
    const arpeggioThreshold = tripletThreshold + (isLastBeat ? swingArpeggio : 0);

    if (roll < eighthThreshold) {
      const dur1 = beatDuration * swingRatio;
      const dur2 = beatDuration * (1 - swingRatio);
      playBassNote(ctx, now, freq, dur1 * 0.95);
      if (isLastBeat) {
        const nextRoot = getNextChordRoot();
        const nextRootMidi = nextRoot !== null ? midiFromPitchClass(nextRoot, midiNote) : midiNote;
        const approachMidi = midiNote + (nextRootMidi > midiNote ? 1 : -1);
        playBassNote(ctx, now + dur1 + jitter(), midiToFreq(approachMidi), dur2 * 1.1);
      } else {
        playBassNote(ctx, now + dur1 + jitter(), freq, dur2 * 1.1);
      }
      return;
    } else if (roll < dottedThreshold) {
      const nextTarget = getNextBeatTarget(rootIndex, quality, chordBeats);
      const splitPoint = beatDuration * (1.45 + Math.random() * 0.1);
      playBassNote(ctx, now, freq, splitPoint * 0.95);
      playBassNote(ctx, now + splitPoint + jitter(), midiToFreq(nextTarget), (beatDuration * 2 - splitPoint) * 0.9);
      walkingBassSkipNext = true;
      return;
    } else if (roll < tripletThreshold) {
      const tripDur = beatDuration / 3;
      const nextRoot = getNextChordRoot();
      const nextRootMidi = nextRoot !== null ? midiFromPitchClass(nextRoot, midiNote) : midiNote;
      const ascending = nextRootMidi >= midiNote;
      // Note 3: chromatic approach to next root
      const note3 = nextRootMidi + (ascending ? -1 : 1);

      const chordTones = getChordTones(rootIndex, quality);
      const harmonyInfo = getHarmonyInfo();
      const scaleTones = harmonyInfo && harmonyInfo.scaleTones ? harmonyInfo.scaleTones : null;

      // Note 1: chord tone, ascending = below note3, descending = above note3
      // Must leave room for note2 between note1 and note3
      let note1 = null;
      if (ascending) {
        for (let m = note3 - 2; m >= note3 - 7; m--) {
          const pc = ((m % 12) + 12) % 12;
          if (chordTones.includes(pc) && m !== midiNote) { note1 = m; break; }
        }
        if (note1 === null) note1 = note3 - 3;
      } else {
        for (let m = note3 + 2; m <= note3 + 7; m++) {
          const pc = ((m % 12) + 12) % 12;
          if (chordTones.includes(pc) && m !== midiNote) { note1 = m; break; }
        }
        if (note1 === null) note1 = note3 + 3;
      }

      // Note 2: chord/scale tone strictly between note1 and note3
      let note2 = null;
      if (ascending) {
        for (let m = note1 + 1; m < note3; m++) {
          const pc = ((m % 12) + 12) % 12;
          if (chordTones.includes(pc)) { note2 = m; break; }
        }
        if (note2 === null) {
          for (let m = note1 + 1; m < note3; m++) {
            const pc = ((m % 12) + 12) % 12;
            if (scaleTones && scaleTones.includes(pc)) { note2 = m; break; }
          }
        }
      } else {
        for (let m = note1 - 1; m > note3; m--) {
          const pc = ((m % 12) + 12) % 12;
          if (chordTones.includes(pc)) { note2 = m; break; }
        }
        if (note2 === null) {
          for (let m = note1 - 1; m > note3; m--) {
            const pc = ((m % 12) + 12) % 12;
            if (scaleTones && scaleTones.includes(pc)) { note2 = m; break; }
          }
        }
      }
      if (note2 === null) note2 = Math.round((note1 + note3) / 2);

      playBassNote(ctx, now, midiToFreq(note1), tripDur * 0.9);
      playBassNote(ctx, now + tripDur + jitter(), midiToFreq(note2), tripDur * 0.9);
      playBassNote(ctx, now + tripDur * 2 + jitter(), midiToFreq(note3), tripDur * 0.9);
      return;
    } else if (roll < arpeggioThreshold) {
      const tripDur = beatDuration / 3;
      const nextRoot = getNextChordRoot();
      const nextRootMidi = nextRoot !== null ? midiFromPitchClass(nextRoot, midiNote) : midiNote;
      const chordTones = getChordTones(rootIndex, quality);

      // Build arpeggio patterns: 1-3-5, 5-3-1, 3-5-7, 7-5-3
      const patterns = [];
      const ct = chordTones;
      if (ct.length >= 3) {
        patterns.push([ct[0], ct[1], ct[2]]); // 1-3-5
        patterns.push([ct[2], ct[1], ct[0]]); // 5-3-1
      }
      if (ct.length >= 4) {
        patterns.push([ct[1], ct[2], ct[3]]); // 3-5-7
        patterns.push([ct[3], ct[2], ct[1]]); // 7-5-3
      }

      // Score each pattern: minimize distance from beat3 to note1, and from note3 to next root
      let bestPattern = patterns[0];
      let bestCost = Infinity;
      for (const pat of patterns) {
        const n1midi = midiFromPitchClass(pat[0], midiNote);
        const n3midi = midiFromPitchClass(pat[2], nextRootMidi);
        const cost = Math.abs(n1midi - midiNote) + Math.abs(n3midi - nextRootMidi);
        if (cost < bestCost) { bestCost = cost; bestPattern = pat; }
      }

      const arp1 = midiFromPitchClass(bestPattern[0], midiNote);
      const arp3 = midiFromPitchClass(bestPattern[2], nextRootMidi);
      const arp2 = midiFromPitchClass(bestPattern[1], Math.round((arp1 + arp3) / 2));

      playBassNote(ctx, now, midiToFreq(arp1), tripDur * 0.9);
      playBassNote(ctx, now + tripDur + jitter(), midiToFreq(arp2), tripDur * 0.9);
      playBassNote(ctx, now + tripDur * 2 + jitter(), midiToFreq(arp3), tripDur * 0.9);
      return;
    }
  }

  playBassNote(ctx, now + jitter() * 0.5, freq, beatDuration * 1.1);
}

function playBossaHeadBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay) {
  const beatInPattern = playbackBeatInChord % 4;
  const beatsLeft = chordBeats - playbackBeatInChord;
  const rootFreq = noteFrequency(rootIndex, 2);
  const fifthFreq = noteFrequency(getFifth(rootIndex, quality), 2);

  if (beatInPattern === 0) {
    const noteDur = beatsLeft <= 2 ? beatDuration * beatsLeft : beatDuration * 2;
    playBassNote(ctx, now, rootFreq, noteDur);
  } else if (beatInPattern === 1 && beatsLeft >= 2) {
    playBassNote(ctx, now + offBeatDelay, fifthFreq, beatDuration * 1.5);
  }
}

function playBossaSoloBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay) {
  const harmonyInfo = getHarmonyInfo();
  const rootFreq2 = noteFrequency(rootIndex, 2);
  const rootFreq3 = noteFrequency(rootIndex, 3);
  const fifthFreq = noteFrequency(getFifth(rootIndex, quality), 2);
  const tones = getChordTones(rootIndex, quality);
  const thirdFreq = noteFrequency(tones.length > 1 ? tones[1] : rootIndex, 2);
  const isTritSub = harmonyInfo && harmonyInfo.isTritoneSubstitution;
  const pattern = harmonyInfo && harmonyInfo.patternRole;
  const measureParity = drumMeasureCount % 2;

  if (measureParity === 0) {
    if (playbackBeatInMeasure === 0) {
      playBassNote(ctx, now, rootFreq2, beatDuration * 1.5);
    } else if (playbackBeatInMeasure === 1) {
      // On V chord, use b7 for stronger pull; otherwise 3rd
      const beat2Note = (pattern === 'V' && tones.length > 3)
        ? noteFrequency(tones[3], 2) : thirdFreq;
      playBassNote(ctx, now + offBeatDelay, beat2Note, beatDuration * 0.5);
    } else if (playbackBeatInMeasure === 2) {
      playBassNote(ctx, now, fifthFreq, beatDuration * 1.5);
    } else if (playbackBeatInMeasure === 3) {
      playBassNote(ctx, now + offBeatDelay, rootFreq3, beatDuration * 0.8);
    }
  } else {
    if (playbackBeatInMeasure === 0) {
      playBassNote(ctx, now, rootFreq3, beatDuration * 1.5);
    } else if (playbackBeatInMeasure === 1) {
      playBassNote(ctx, now + offBeatDelay, thirdFreq, beatDuration * 0.5);
    } else if (playbackBeatInMeasure === 2) {
      // Use scale passing tone if available
      const passing = pickScalePassingTone(rootIndex, quality, 2, harmonyInfo);
      const beat3Freq = passing !== null ? noteFrequency(passing, 2) : fifthFreq;
      playBassNote(ctx, now, beat3Freq, beatDuration * 1.5);
    } else if (playbackBeatInMeasure === 3) {
      const nextRoot = getNextChordRoot();
      if (nextRoot !== null) {
        // Tritone sub: chromatic descent; otherwise harmonic approach
        const approachNote = isTritSub
          ? (rootIndex + 11) % 12
          : pickApproachNote(nextRoot, harmonyInfo);
        playBassNote(ctx, now + offBeatDelay, noteFrequency(approachNote, 2), beatDuration * 0.8);
      } else {
        playBassNote(ctx, now + offBeatDelay, rootFreq2, beatDuration * 0.8);
      }
    }
  }
}

function playBass() {
  if (bassVolume === 0) return;
  if (playbackIndex >= playbackElements.length) return;
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const beatDuration = 60 / playbackBPM;
  const isSwing = rhythm === 'swing';
  const offBeatDelay = isSwing ? beatDuration * 2 / 3 : beatDuration / 2;

  const current = playbackElements[playbackIndex];
  const name = current.element.querySelector('.chord, .chord-chart-label')?.textContent
    || current.element.textContent.trim();
  const parsed = ChordLibrary.parseChord(name);
  if (!parsed) return;

  const rootIndex = parsed.rootIndex;
  const quality = parsed.quality || '';
  const chordBeats = current.beats;

  if (isLastChord() && playbackBeatInChord > 0) return;
  if (isLastChord() && playbackBeatInChord === 0) {
    playBassNote(ctx, now, noteFrequency(rootIndex, 2), beatDuration * 4);
    return;
  }

  if (isSwing) {
    if (bassMode === 'head') playSwingHeadBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay);
    else playSwingWalkingBass(ctx, now, rootIndex, quality, chordBeats, beatDuration);
  } else {
    if (bassMode === 'head') playBossaHeadBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay);
    else playBossaSoloBass(ctx, now, rootIndex, quality, chordBeats, beatDuration, offBeatDelay);
  }
}

<script>

  } else {

function getTranspose() { return transposeAmount; }

  transposeAmount += dir;

// --- Fit to Page (smart: tries columns 1/2/3 × font sizes) ---
function fitToPage() {
  const container = document.querySelector('.main-content');
  const slider = document.querySelector('.size-control input');
  let bestCols = 1, bestSize = 10;

  for (const cols of [1, 2, 3]) {
    setColumns(cols);
    let lo = 10, hi = 36;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      document.documentElement.style.setProperty('--dynamic-font-size', mid + 'px');
      void container.offsetHeight;
      if (container.scrollHeight <= container.clientHeight) {
        lo = mid;
      } else {
        hi = mid - 1;
      }

    if (lo > bestSize || (lo === bestSize && cols < bestCols)) {
      bestSize = lo;
      bestCols = cols;

  setColumns(bestCols);
  document.documentElement.style.setProperty('--dynamic-font-size', bestSize + 'px');

// --- Auto-scroll ---
function adjustScrollSpeed(dir) {
  scrollSpeed = Math.max(0, Math.min(10, scrollSpeed + dir));
  document.getElementById('scrollSpeed').textContent = scrollSpeed;
  const ms = document.getElementById('mobileScrollSpeed');
  if (ms) ms.textContent = scrollSpeed;
  if (scrollSpeed === 0 && scrollInterval) stopAutoScroll();
}

function floatAdjustSpeed(dir) {
  adjustScrollSpeed(dir);
  document.getElementById('floatSpeed').textContent = scrollSpeed;
}

function toggleAutoScroll() {
  if (scrollInterval) { stopAutoScroll(); } else { startAutoScroll(); }
}

function startAutoScroll() {
  if (playbackTimeout) stopPlayback();
  if (scrollSpeed === 0) { scrollSpeed = 1; document.getElementById('scrollSpeed').textContent = '1'; }
  const btn = document.getElementById('scrollPlayBtn');
  btn.innerHTML = '&#9632;';
  btn.classList.add('playing');
  document.getElementById('floatSpeed').textContent = scrollSpeed;
  document.getElementById('floatScroll').classList.add('visible');
  const container = document.querySelector('.main-content');
  scrollInterval = setInterval(() => {
    container.scrollTop += scrollSpeed * 0.5;
    if (container.scrollTop >= container.scrollHeight - container.clientHeight) stopAutoScroll();
  }, 50);
}

function stopAutoScroll() {
  clearInterval(scrollInterval);
  scrollInterval = null;
  const btn = document.getElementById('scrollPlayBtn');
  btn.innerHTML = '&#9654;';
  btn.classList.remove('playing');
  document.getElementById('floatScroll').classList.remove('visible');
}

function scrollToTop() {
  stopAutoScroll();
  document.querySelector('.main-content').scrollTop = 0;
}

// --- Playback engine (beat-based with metronome) ---
let audioCtx = null;
let playbackBeatsPerMeasure = 4;
let playbackBeatInMeasure = 0;
let playbackBeatInChord = 0;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playClick(accent) {
  if (clickVolume === 0) return;
  const ctx = getAudioCtx();
  const dest = getAudioBus('click');
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(dest);
  osc.frequency.value = accent ? 1000 : 700;
  gain.gain.setValueAtTime(accent ? 0.3 : 0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.08);
}
