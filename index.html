function togglePlayback() {
  if (playbackTimeout) stopPlayback(); else startPlayback();
}


function startPlayback(startIndex) {
  if (playbackElements.length === 0) return;
  // Force fresh AudioContext on mobile
  if (audioCtx && audioCtx.state === 'closed') audioCtx = null;
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  audioCtx.resume().then(() => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.frequency.value = 440;
    g.gain.value = 1.0;
    osc.start(0);
    osc.stop(audioCtx.currentTime + 0.5);
  });
  if (scrollInterval) stopAutoScroll();
  currentPass = 0;
  if (startIndex != null) {
    playbackIndex = startIndex;
  } else if (formMap && formMap.introStart !== null) {
    playbackIndex = formMap.introStart;
  } else if (formMap && formMap.formStart !== null) {
    playbackIndex = formMap.formStart;
  } else {
    playbackIndex = 0;
  }
  playbackBeatInChord = 0;
  playbackBeatInMeasure = 0;
  resetBackingTrack();
  const btn = document.getElementById('playbackBtn');
  btn.innerHTML = '&#9632;';
  btn.classList.add('playing');
  const mBtn = document.getElementById('mobilePlayBtn');
  if (mBtn) { mBtn.innerHTML = '&#9632;'; mBtn.classList.add('playing'); }
  document.getElementById('floatTempo').textContent = playbackBPM;
  document.getElementById('floatPlayback').classList.add('visible');
  const dotsEl = document.getElementById('beatDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < playbackBeatsPerMeasure; i++) {
    const dot = document.createElement('span');
    dot.className = 'beat-dot';
    dotsEl.appendChild(dot);
  }
  updateBeatDisplay();
  updatePassDisplay();
  highlightCurrentChord();
  getAudioCtx();
  countOffBeat = 0;
  playClick(true);
  countOffBeat = 1;
  playbackBeatInMeasure = 1;
  updateBeatDisplay();
  scheduleCountOff();
}

let countOffBeat = 0;

function scheduleCountOff() {
  const ms = (1 / playbackBPM) * 60000;
  playbackTimeout = setTimeout(() => {
    if (countOffBeat < playbackBeatsPerMeasure) {
      playClick(countOffBeat === 0);
      countOffBeat++;
      playbackBeatInMeasure = countOffBeat % playbackBeatsPerMeasure;
      updateBeatDisplay();
      scheduleCountOff();
    } else {
      playbackBeatInMeasure = 0;
      updateBeatDisplay();
      playClick(true);
      playBass();
      playDrumBeat();
      scheduleBeatTick();
    }
  }, ms);
}

function stopPlayback() {
  if (playbackTimeout) { clearTimeout(playbackTimeout); playbackTimeout = null; }
  document.querySelectorAll('.chord-playing').forEach(el => el.classList.remove('chord-playing'));
  const marker = document.querySelector('.coda-marker');
  if (marker) marker.classList.remove('flash');
  const codaLabel = document.querySelector('.coda-section-label');
  if (codaLabel) codaLabel.classList.remove('flash');
  const btn = document.getElementById('playbackBtn');
  btn.innerHTML = '&#9654;';
  btn.classList.remove('playing');
  const mBtn = document.getElementById('mobilePlayBtn');
  if (mBtn) { mBtn.innerHTML = '&#9654;'; mBtn.classList.remove('playing'); }
  document.getElementById('floatPlayback').classList.remove('visible');
  document.getElementById('floatChordName').textContent = '--';
}

function highlightCurrentChord() {
  document.querySelectorAll('.chord-playing, .chord-playing-alt').forEach(el => {
    el.classList.remove('chord-playing');
    el.classList.remove('chord-playing-alt');
  });
  if (playbackIndex >= playbackElements.length) return;
  const current = playbackElements[playbackIndex];
  current.element.classList.add('chord-playing');
  const name = current.element.querySelector('.chord, .chord-chart-label, .ireal-cell-label')?.textContent
    || current.element.textContent.trim();
  document.getElementById('floatChordName').textContent = name;
  current.element.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (currentTuning === 'BOTH' && altPlaybackElements.length) {
    const alt = altPlaybackElements[playbackIndex];
    if (alt) alt.element.classList.add('chord-playing-alt');
  }
  updateCodaFlash();
}

function updateCodaFlash() {
  const marker = document.querySelector('.coda-marker');
  if (!formMap || formMap.codaJumpIndex === null) return;
  const onLastPass = (currentPass >= formRepeatCount - 1) && (currentPass < formRepeatCount);
  let shouldFlash = false;
  if (onLastPass && playbackIndex < formMap.codaJumpIndex) {
    let beatsAhead = -playbackBeatInChord;
    for (let i = playbackIndex; i < formMap.codaJumpIndex && i < playbackElements.length; i++) {
      beatsAhead += playbackElements[i].beats;
    }
    const secondsAhead = beatsAhead * (60 / playbackBPM);
    shouldFlash = secondsAhead <= 5;
  }
  if (marker) marker.classList.toggle('flash', shouldFlash);
  const codaLabel = document.querySelector('.coda-section-label');
  if (codaLabel) codaLabel.classList.toggle('flash', shouldFlash);
}

function updateBeatDisplay() {
  const dots = document.querySelectorAll('.beat-dot');
  dots.forEach((dot, i) => {
    dot.classList.toggle('active', i === playbackBeatInMeasure);
  });
}

function scheduleBeatTick() {
  const ms = (1 / playbackBPM) * 60000;
  playbackTimeout = setTimeout(() => {
    playbackBeatInChord++;
    playbackBeatInMeasure = (playbackBeatInMeasure + 1) % playbackBeatsPerMeasure;

    if (playbackIndex < playbackElements.length) {
      const current = playbackElements[playbackIndex];
      if (playbackBeatInChord >= current.beats) {
        playbackBeatInChord = 0;
        playbackIndex++;
        if (!advancePlayback()) return;
      }
    }

    playClick(playbackBeatInMeasure === 0);
    playBass();
    playDrumBeat();
    updateBeatDisplay();
    scheduleBeatTick();
  }, ms);
}

function advancePlayback() {
  if (!formMap || formMap.formStart === null) {
    if (playbackIndex >= playbackElements.length) { stopPlayback(); return false; }
    highlightCurrentChord();
    return true;
  }

  const onLastFormPass = (currentPass >= formRepeatCount - 1);
  const inCodaPhase = (currentPass >= formRepeatCount);

  // Already in coda section (after form repeats are done)
  if (inCodaPhase && formMap.codaStart !== null && playbackIndex >= formMap.codaStart) {
    if (playbackIndex > formMap.codaEnd) { stopPlayback(); return false; }
    highlightCurrentChord();
    return true;
  }

  // CODA jump: on last pass, when we reach the coda jump index, skip to coda
  if (formMap.codaJumpIndex !== null && onLastFormPass && playbackIndex === formMap.codaJumpIndex
      && formMap.codaStart !== null) {
    currentPass = formRepeatCount;
    playbackIndex = formMap.codaStart;
    highlightCurrentChord();
    updatePassDisplay();
    return true;
  }

  // Past end of form
  if (playbackIndex > formMap.formEnd) {
    if (!onLastFormPass) {
      currentPass++;
      playbackIndex = formMap.formStart;
      resetBackingTrack();
      highlightCurrentChord();
      updatePassDisplay();
      return true;
    } else {
      if (formMap.codaStart !== null) {
        currentPass = formRepeatCount;
        playbackIndex = formMap.codaStart;
        highlightCurrentChord();
        updatePassDisplay();
        return true;
      }
      stopPlayback();
      return false;
    }
  }

  // Past end of all elements
  if (playbackIndex >= playbackElements.length) {
    stopPlayback();
    return false;
  }

  highlightCurrentChord();
  return true;
}

function adjustTempo(delta) {
  playbackBPM = Math.max(20, Math.min(300, playbackBPM + delta));
  document.getElementById('tempoDisplay').textContent = playbackBPM;
  document.getElementById('floatTempo').textContent = playbackBPM;
  const mt = document.getElementById('mobileTempoDisplay');
  if (mt) mt.textContent = playbackBPM;
  if (playbackTimeout) {
    clearTimeout(playbackTimeout);
    scheduleBeatTick();
  }
}

function restartPlayback() {
  stopPlayback();
  startPlayback();
}

function adjustFormRepeats(delta) {
  formRepeatCount = Math.max(1, Math.min(20, formRepeatCount + delta));
  updateRepeatDisplay();
  updatePassDisplay();
}

function updateRepeatDisplay() {
  const el = document.getElementById('repeatCount');
  if (el) el.textContent = formRepeatCount;
  const floatEl = document.getElementById('floatRepeatCount');
  if (floatEl) floatEl.textContent = formRepeatCount;
}

function updatePassDisplay() {
  const el = document.getElementById('floatPassDisplay');
  if (!el) return;
  if (currentPass >= formRepeatCount) {
    el.textContent = 'Coda';
  } else {
    el.textContent = (currentPass + 1) + '/' + formRepeatCount;
  }
}

// --- Keyboard shortcuts ---
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;

  if (e.key === 'Escape') {
    e.preventDefault();
    if (playbackTimeout) stopPlayback();
    else scrollToTop();
  } else if (e.key === ' ') {
    e.preventDefault();
    if (playbackTimeout) stopPlayback();
    else toggleAutoScroll();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    floatAdjustSpeed(1);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    floatAdjustSpeed(-1);
  }
});

// --- Touch: single tap toggles pause, double-tap goes to top ---
let lastTapTime = 0;
document.getElementById('output')?.addEventListener('click', (e) => {
  if (e.target.closest('.float-scroll')) return;
  const now = Date.now();
  if (now - lastTapTime < 350) {
    scrollToTop();
    lastTapTime = 0;
  } else {
    if (scrollInterval) {
      stopAutoScroll();
    }
    lastTapTime = now;
  }
});

// --- Mobile sidebar ---
function toggleMobileSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
  document.querySelector('.sidebar-overlay').classList.toggle('active');
}

// --- Song Library ---
function handleFileSelect(input) {
  const files = Array.from(input.files);
  let processed = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const content = e.target.result;
      const title = extractTitle(content) || file.name.replace(/\.(txt|pro|chopro)$/, '');
      const artist = extractArtist(content) || '';
      if (!library.some(s => s.title === title)) {
        library.push({ id: Date.now() + Math.random(), title, artist, content });
      }
      processed++;
      if (processed === files.length) {
        saveLibrary();
        updateSidebar();
      }
    };
    reader.readAsText(file);
  });
  input.value = '';
}

function extractTitle(text) {
  const m = text.match(/^Title:\s*(.*)$/m) || text.match(/\{title:\s*(.+?)\}/i) || text.match(/\{t:\s*(.+?)\}/i);
  return m ? m[1].trim() : null;
}

function extractArtist(text) {
  const m = text.match(/^Artist:\s*(.*)$/m) || text.match(/\{artist:\s*(.+?)\}/i);
  return m ? m[1].trim() : null;
}

function deleteSong(id) {
  library = library.filter(s => s.id !== id);
  if (activeSongId === id) activeSongId = null;
  saveLibrary();
  updateSidebar();
}

function updateSidebar() {
  const list = document.getElementById('songList');
  const search = document.getElementById('sidebarSearch').value.toLowerCase();
  list.innerHTML = '';

  const filtered = library
    .filter(s => s.title.toLowerCase().includes(search) || s.artist.toLowerCase().includes(search))
    .sort((a, b) => a.title.localeCompare(b.title));

  if (filtered.length === 0) {
    const li = document.createElement('li');
    li.className = 'sidebar-empty';
    li.textContent = library.length === 0 ? 'No songs imported yet.' : 'No matches found.';
    list.appendChild(li);
    return;
  }

  filtered.forEach(song => {
    const li = document.createElement('li');
    if (song.id === activeSongId) li.classList.add('active');

    const info = document.createElement('div');
    info.className = 'song-info';
    const titleDiv = document.createElement('div');
    titleDiv.className = 'song-title';
    titleDiv.textContent = song.title;
    const artistDiv = document.createElement('div');
    artistDiv.className = 'song-artist';
    artistDiv.textContent = song.artist;
    info.appendChild(titleDiv);
    info.appendChild(artistDiv);
    info.addEventListener('click', () => {
      list.querySelectorAll('li').forEach(el => el.classList.remove('active'));
      li.classList.add('active');
      loadSongFromLibrary(song);
      if (window.innerWidth <= 768) toggleMobileSidebar();
    });

    const del = document.createElement('button');
    del.className = 'song-delete';
    del.innerHTML = '&times;';
    del.title = 'Remove from library';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSong(song.id);
    });

    li.appendChild(info);
    li.appendChild(del);
    list.appendChild(li);
  });
}

function loadSongFromLibrary(song) {
  activeSongId = song.id;
  document.getElementById('chordProInput').value = song.content;
  transposeAmount = 0;
  document.getElementById('transposeValue').textContent = '0';
  updateEditorHighlight();
  renderSong();
}

function saveAsFile() {
  const text = document.getElementById('chordProInput').value;
  if (!text.trim()) return;
  const title = extractTitle(text) || 'my_song';
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// --- localStorage ---
function saveLibrary() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(library)); } catch(e) {}
}

function loadLibrary() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      library = JSON.parse(data);
      updateSidebar();
    }
  } catch(e) {}
}

function loadRemoteSongs() {
  const base = document.location.href.replace(/[^/]*$/, '');
  const manifestUrl = base + 'songs/index.json';
  fetch(manifestUrl).then(r => {
    if (!r.ok) return;
    return r.json();
  }).then(manifest => {
    if (!manifest) return;
    const fetches = manifest.map(entry =>
      fetch(base + 'songs/' + encodeURIComponent(entry.file))
        .then(r => r.ok ? r.text() : null)
        .then(content => content ? { ...entry, content } : null)
    );
    return Promise.all(fetches);
  }).then(songs => {
    if (!songs) return;
    const remoteTitles = new Set();
    for (const song of songs) {
      if (!song) continue;
      remoteTitles.add(song.title);
      const existing = library.find(s => s.title === song.title);
      if (existing) {
        existing.content = song.content;
        existing.artist = song.artist;
        existing.remote = true;
      } else {
        library.push({ id: Date.now() + Math.random(), title: song.title, artist: song.artist, content: song.content, remote: true });
      }
    }
    saveLibrary();
    updateSidebar();
    if (!activeSongId && library.length > 0) {
      loadSongFromLibrary(library[0]);
    }
  }).catch(() => {});
}

let syncTimeout;
function syncEditorToLibrary() {
  if (!activeSongId) return;
  const song = library.find(s => s.id === activeSongId);
  if (!song) return;
  const content = document.getElementById('chordProInput').value;
  song.content = content;
  song.title = extractTitle(content) || song.title;
  song.artist = extractArtist(content) || song.artist;
  saveLibrary();
  updateSidebar();
}

// --- ChordPro Parser ---
function parseChordPro(text) {
  let input = text;
  const result = { title: '', artist: '', time: null, lines: [] };

  const plainTitle = input.match(/^Title:\s*(.*)$/m);
  const plainArtist = input.match(/^Artist:\s*(.*)$/m);
  if (plainTitle) {
    result.title = plainTitle[1].trim();
    input = input.replace(plainTitle[0], '');
  }
  if (plainArtist) {
    result.artist = plainArtist[1].trim();
    input = input.replace(plainArtist[0], '');
  }

  const lines = input.split('\n');
  for (const raw of lines) {
    const line = raw.trimEnd();

    const directiveMatch = line.match(/^\{(\w+)(?::\s*(.+?))?\}$/);
    if (directiveMatch) {
      const cmd = directiveMatch[1].toLowerCase();
      const val = directiveMatch[2] || '';
      if (cmd === 'to_coda') continue;
      if (cmd === 'title' || cmd === 't') { if (!result.title) result.title = val; }
      else if (cmd === 'artist') { if (!result.artist) result.artist = val; }
      else if (cmd === 'time') {
        const tm = val.match(/^(\d+)\/(\d+)$/);
        if (tm) result.time = { beats: parseInt(tm[1]), noteValue: parseInt(tm[2]) };
        result.lines.push({ type: 'directive', cmd, val });
      }
      else result.lines.push({ type: 'directive', cmd, val });
      continue;
    }

    const sectionMatch = line.match(/^\{(.+?)\}$/);
    if (sectionMatch) {
      result.lines.push({ type: 'directive', cmd: 'section', val: sectionMatch[1].replace(/:$/, '') });
      continue;
    }

    if (line.includes('[')) {
      const segments = [];
      const tokenRegex = /\[([^\],:]+)(?::(\d+(?:\.\d+)?))?(?:,(\d+))?\]|\{to_coda\}/gi;
      let last = 0;
      let m;
      while ((m = tokenRegex.exec(line)) !== null) {
        const textBefore = line.substring(last, m.index);
        if (textBefore) {
          segments.push({ chord: null, beats: 0, voicingIndex: 0, text: textBefore });
        }
        if (m[0].toLowerCase() === '{to_coda}') {
          segments.push({ chord: null, beats: 0, voicingIndex: 0, text: '', marker: 'to_coda' });
        } else {
          segments.push({
            chord: m[1],
            beats: m[2] ? parseFloat(m[2]) : 0,
            voicingIndex: m[3] ? parseInt(m[3]) : 0,
            text: ''
          });
        }
        last = m.index + m[0].length;
      }
      const trailing = line.substring(last);
      if (segments.length > 0 && trailing) {
        const lastSeg = segments[segments.length - 1];
        if (lastSeg.chord) {
          lastSeg.text = trailing;
        } else {
          segments.push({ chord: null, beats: 0, voicingIndex: 0, text: trailing });
        }
      }
      for (let i = 0; i < segments.length - 1; i++) {
        if (segments[i].chord && !segments[i].text && !segments[i + 1].chord && !segments[i + 1].marker) {
          segments[i].text = segments[i + 1].text;
          segments.splice(i + 1, 1);
        }
      }
      result.lines.push({ type: 'chordline', segments });
    } else {
      result.lines.push({ type: 'text', text: line });
    }
  }
  return result;
}

function collectChords(song, semitones) {
  const useFlats = semitones < 0;
  const seen = new Set();
  const chords = [];
  for (const line of song.lines) {
    if (line.type !== 'chordline') continue;
    for (const seg of line.segments) {
      if (!seg.chord) continue;
      const transposed = ChordLibrary.transposeChord(seg.chord, semitones, useFlats);
      const key = transposed + '|' + seg.voicingIndex;
      if (!seen.has(key)) {
        seen.add(key);
        chords.push({ name: transposed, voicingIndex: seg.voicingIndex });
      }
    }
  }
  return chords;
}

function buildRoadmapFromSong(song) {
  const sections = [];
  let currentLabel = '';
  let currentStart = 0;
  let chordIndex = 0;
  let codaJumpChordIndex = null;

  for (const line of song.lines) {
    if (line.type === 'directive') {
      const cmd = line.cmd;
      if (cmd === 'end_of_chorus' || cmd === 'eoc' || cmd === 'end_of_verse' || cmd === 'eov' || cmd === 'time') continue;
      if (cmd === 'start_of_chorus' || cmd === 'soc') {
        if (chordIndex > currentStart) sections.push({ label: currentLabel, startChord: currentStart, endChord: chordIndex - 1 });
        currentLabel = 'Chorus';
        currentStart = chordIndex;
      } else if (cmd === 'start_of_verse' || cmd === 'sov') {
        if (chordIndex > currentStart) sections.push({ label: currentLabel, startChord: currentStart, endChord: chordIndex - 1 });
        currentLabel = 'Verse';
        currentStart = chordIndex;
      } else if (cmd === 'comment' || cmd === 'c') {
        // comments don't start a new section
      } else {
        if (chordIndex > currentStart) sections.push({ label: currentLabel, startChord: currentStart, endChord: chordIndex - 1 });
        currentLabel = line.val || line.cmd;
        currentStart = chordIndex;
      }
    } else if (line.type === 'chordline') {
      for (const seg of line.segments) {
        if (seg.marker === 'to_coda') {
          codaJumpChordIndex = chordIndex;
        } else if (seg.chord) {
          chordIndex++;
        }
      }
    }
  }
  if (chordIndex > currentStart) sections.push({ label: currentLabel, startChord: currentStart, endChord: chordIndex - 1 });

  return { sections, codaJumpChordIndex, chordCount: chordIndex };
}

let playIndex = 0;

function renderPane(song, semitones, useFlats, container, tuning) {
  if (currentChordFormat === 'text') {
    const usedChords = collectChords(song, semitones);
    if (usedChords.length) {
      const strip = document.createElement('div');
      strip.className = 'chord-strip';
      for (const c of usedChords) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.classList.add('chord-diagram');
        const frets = ChordLibrary.getChordFrets(c.name, tuning, c.voicingIndex);
        const label = c.voicingIndex > 0 ? c.name + ' (v' + c.voicingIndex + ')' : c.name;
        ChordRenderer.render(svg, label, frets, tuning);
        strip.appendChild(svg);
      }
      container.appendChild(strip);
    }
  }

  const savedTuning = currentTuning;
  currentTuning = tuning;
  if (currentLayout === 'grid') {
    renderGrid(song, semitones, useFlats, container);
  } else {
    renderLyrics(song, semitones, useFlats, container);
  }
  currentTuning = savedTuning;
}

function renderSong() {
  if (playbackTimeout) stopPlayback();
  playIndex = 0;
  chordToPlayIndex = [];
  const text = document.getElementById('chordProInput').value;
  const song = parseChordPro(text);
  playbackBeatsPerMeasure = song.time ? song.time.beats : 4;
  const semitones = getTranspose();
  const useFlats = semitones < 0;
  const output = document.getElementById('output');
  output.innerHTML = '';

  if (song.title) {
    const h = document.createElement('div');
    h.className = 'song-title-display';
    h.textContent = song.title;
    output.appendChild(h);
  }
  if (song.artist) {
    const a = document.createElement('div');
    a.className = 'song-meta';
    a.textContent = song.artist;
    output.appendChild(a);
  }

  if (currentTuning === 'BOTH') {
    const dual = document.createElement('div');
    dual.className = 'dual-tuning';

    const leftPane = document.createElement('div');
    leftPane.className = 'dual-tuning-pane';
    const leftHeader = document.createElement('div');
    leftHeader.className = 'dual-tuning-pane-header';
    leftHeader.textContent = 'Standard (GCEA)';
    leftPane.appendChild(leftHeader);
    renderPane(song, semitones, useFlats, leftPane, 'GCEA');

    const savedPlayIndex = playIndex;
    const savedChordToPlayIndex = [...chordToPlayIndex];
    playIndex = 0;
    chordToPlayIndex = [];

    const rightPane = document.createElement('div');
    rightPane.className = 'dual-tuning-pane';
    const rightHeader = document.createElement('div');
    rightHeader.className = 'dual-tuning-pane-header';
    rightHeader.textContent = 'Baritone (DGBE)';
    rightPane.appendChild(rightHeader);
    renderPane(song, semitones, useFlats, rightPane, 'DGBE');

    playIndex = savedPlayIndex;
    chordToPlayIndex = savedChordToPlayIndex;

    dual.appendChild(leftPane);
    const divider = document.createElement('div');
    divider.className = 'dual-tuning-divider';
    dual.appendChild(divider);
    dual.appendChild(rightPane);
    output.appendChild(dual);
  } else {
    renderPane(song, semitones, useFlats, output, currentTuning);
  }

  buildPlaybackList();

  const roadmap = buildRoadmapFromSong(song);
  buildFormMap(roadmap);
  chordAnalysis = HarmonicAnalysis.analyze(song, roadmap.sections);
  registerChordClickHandlers();
  annotateAnalysis();
}

function registerChordClickHandlers() {
  for (const item of playbackElements) {
    item.element.addEventListener('dblclick', (e) => {
      e.preventDefault();
      const idx = parseInt(item.element.dataset.playIndex);
      if (playbackTimeout) stopPlayback();
      startPlayback(idx);
    });
    item.element.style.cursor = 'pointer';
  }
}

function toggleAnalysis() {
  document.getElementById('output').classList.toggle('show-analysis');
  document.getElementById('analysisBtn').classList.toggle('active');
}

const NOTE_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

function annotateAnalysis() {
  if (!chordAnalysis || chordAnalysis.length === 0) return;
  let lastKeyTonic = -1;
  for (let logIdx = 0; logIdx < chordToPlayIndex.length; logIdx++) {
    const info = chordAnalysis[logIdx];
    if (!info) continue;
    const playIdx = chordToPlayIndex[logIdx];
    const item = playbackElements.find(el => parseInt(el.element.dataset.playIndex) === playIdx);
    if (!item) continue;
    const el = item.element;

    if (info.key.tonic !== lastKeyTonic) {
      const keySpan = document.createElement('span');
      keySpan.className = 'analysis-key';
      keySpan.textContent = NOTE_NAMES[info.key.tonic] + ' ' + info.key.mode;
      el.prepend(keySpan);
      lastKeyTonic = info.key.tonic;
    }

    const label = document.createElement('span');
    label.className = 'analysis-label';
    let text = info.roman;
    if (info.patternRole) text += ' [' + info.patternRole + ']';
    if (info.isSecondaryDominant) text += ' sec.dom';
    if (info.isTritoneSubstitution) text += ' tri.sub';
    label.textContent = text;
    el.appendChild(label);
  }
}

let altPlaybackElements = [];

function buildPlaybackList() {
  if (currentTuning === 'BOTH') {
    const panes = document.querySelectorAll('.dual-tuning-pane');
    const leftPane = panes[0];
    const rightPane = panes[1];
    playbackElements = leftPane ? Array.from(leftPane.querySelectorAll('[data-play-index]'))
      .sort((a, b) => +a.dataset.playIndex - +b.dataset.playIndex)
      .map(el => ({ element: el, beats: parseFloat(el.dataset.playBeats) || 1 })) : [];
    altPlaybackElements = rightPane ? Array.from(rightPane.querySelectorAll('[data-play-index]'))
      .sort((a, b) => +a.dataset.playIndex - +b.dataset.playIndex)
      .map(el => ({ element: el, beats: parseFloat(el.dataset.playBeats) || 1 })) : [];
  } else {
    playbackElements = Array.from(document.querySelectorAll('[data-play-index]'))
      .sort((a, b) => +a.dataset.playIndex - +b.dataset.playIndex)
      .map(el => ({ element: el, beats: parseFloat(el.dataset.playBeats) || 1 }));
    altPlaybackElements = [];
  }
}

function buildFormMap(roadmap) {
  let introStart = null, introEnd = null;
  let codaStart = null, codaEnd = null;
  let formStart = null, formEnd = null;

  function chordToPlay(chordIdx) {
    return chordToPlayIndex[chordIdx] != null ? chordToPlayIndex[chordIdx] : chordIdx;
  }
  function chordEndToPlay(chordIdx) {
    if (chordIdx + 1 < chordToPlayIndex.length) return chordToPlayIndex[chordIdx + 1] - 1;
    return playbackElements.length - 1;
  }

  for (const sec of roadmap.sections) {
    const startPI = chordToPlay(sec.startChord);
    const endPI = chordEndToPlay(sec.endChord);
    if (/^intro$/i.test(sec.label)) {
      if (introStart === null) introStart = startPI;
      introEnd = endPI;
    } else if (/^(outro|coda)$/i.test(sec.label)) {
      if (codaStart === null) codaStart = startPI;
      codaEnd = endPI;
    } else {
      if (formStart === null) formStart = startPI;
      formEnd = endPI;
    }
  }

  if (formStart === null && introStart === null && codaStart === null) {
    formStart = 0;
    formEnd = playbackElements.length - 1;
  }

  const codaJumpIndex = roadmap.codaJumpChordIndex !== null ? chordToPlay(roadmap.codaJumpChordIndex) : null;
  formMap = { introStart, introEnd, formStart, formEnd, codaStart, codaEnd, codaJumpIndex };
  updateRepeatDisplay();
}

function renderLyrics(song, semitones, useFlats, output) {
  let logicalChordIndex = 0;

  for (const line of song.lines) {
    if (line.type === 'directive') {
      const cmd = line.cmd;
      if (cmd === 'end_of_chorus' || cmd === 'eoc' || cmd === 'end_of_verse' || cmd === 'eov' || cmd === 'time') continue;
      if (cmd === 'start_of_chorus' || cmd === 'soc') {
        const lbl = document.createElement('span');
        lbl.className = 'section-label';
        lbl.textContent = 'Chorus';
        output.appendChild(lbl);
      } else if (cmd === 'start_of_verse' || cmd === 'sov') {
        const lbl = document.createElement('span');
        lbl.className = 'section-label';
        lbl.textContent = 'Verse';
        output.appendChild(lbl);
      } else if (cmd === 'comment' || cmd === 'c') {
        const d = document.createElement('div');
        d.className = 'directive-line';
        d.textContent = line.val;
        output.appendChild(d);
      } else {
        const lbl = document.createElement('span');
        lbl.className = 'section-label';
        const labelText = line.val || line.cmd;
        lbl.textContent = labelText;
        if (/^(coda|outro)$/i.test(labelText)) lbl.classList.add('coda-section-label');
        output.appendChild(lbl);
      }
      continue;
    }

    if (line.type === 'text') {
      const wrap = document.createElement('div');
      wrap.className = 'line-wrap';
      const lr = document.createElement('div');
      lr.textContent = line.text;
      wrap.appendChild(lr);
      output.appendChild(wrap);
      continue;
    }

    const wrap = document.createElement('div');
    wrap.className = 'line-wrap';

    for (const seg of line.segments) {
      const text = seg.text || '';

      if (seg.marker === 'to_coda') {
        const marker = document.createElement('span');
        marker.className = 'coda-marker';
        marker.textContent = '\u{1F441} Coda';
        wrap.appendChild(marker);
      } else if (seg.chord) {
        chordToPlayIndex[logicalChordIndex] = playIndex;
        logicalChordIndex++;
        const transposed = ChordLibrary.transposeChord(seg.chord, semitones, useFlats);
        const anticipate = text.length > 0 && text[0] === ' ';
        const displayText = anticipate ? text.substring(1) : text;
        const pair = document.createElement('span');
        pair.className = 'chord-pair';
        pair.setAttribute('data-play-index', playIndex);
        pair.setAttribute('data-play-beats', seg.beats || 1);
        playIndex++;
        if (anticipate) pair.classList.add('chord-anticipate');
        if (currentChordFormat === 'chart') {
          const chartLabel = document.createElement('span');
          chartLabel.className = 'chord-chart-label';
          chartLabel.textContent = transposed;
          pair.appendChild(chartLabel);
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          const frets = ChordLibrary.getChordFrets(transposed, currentTuning, seg.voicingIndex);
          ChordRenderer.render(svg, transposed, frets, currentTuning, { hideLabel: true });
          svg.classList.add('chord-inline-diagram');
          pair.appendChild(svg);
        } else {
          const chordSpan = document.createElement('span');
          chordSpan.className = 'chord';
          chordSpan.textContent = transposed;
          pair.appendChild(chordSpan);
        }
        const lyricSpan = document.createElement('span');
        lyricSpan.className = 'lyric';
        lyricSpan.textContent = displayText || ' ';
        pair.appendChild(lyricSpan);
        wrap.appendChild(pair);
      } else if (text) {
        const pair = document.createElement('span');
        pair.className = 'chord-pair';
        if (currentChordFormat === 'text') {
          const chordSpan = document.createElement('span');
          chordSpan.className = 'chord';
          chordSpan.textContent = ' ';
          pair.appendChild(chordSpan);
        }
        const lyricSpan = document.createElement('span');
        lyricSpan.className = 'lyric';
        lyricSpan.textContent = text;
        pair.appendChild(lyricSpan);
        wrap.appendChild(pair);
      }
    }

    output.appendChild(wrap);
  }
}

// --- Grid Renderer ---
function renderGrid(song, semitones, useFlats, output) {
  const beatsPerMeasure = song.time ? song.time.beats : 4;
  const showLyrics = document.getElementById('gridLyricsToggle').checked;
  const chartMode = currentChordFormat === 'chart';
  let logicalChordIndex = 0;

  const sections = [];
  let current = { label: '', inputLines: [] };
  let hasMissingBeats = false;
  let gridCodaMarkerPending = false;

  function flushSection() {
    if (current.inputLines.length) sections.push(current);
  }

  for (const line of song.lines) {
    if (line.type === 'directive') {
      const cmd = line.cmd;
      if (cmd === 'start_of_verse' || cmd === 'sov') {
        flushSection();
        current = { label: 'Verse', inputLines: [] };
      } else if (cmd === 'start_of_chorus' || cmd === 'soc') {
        flushSection();
        current = { label: 'Chorus', inputLines: [] };
      } else if (cmd === 'comment' || cmd === 'c' || cmd === 'section') {
        flushSection();
        current = { label: line.val || cmd, inputLines: [] };
      } else {
        flushSection();
        current = { label: line.val || line.cmd, inputLines: [] };
      }
    } else if (line.type === 'chordline') {
      const lineChords = [];
      let leadingText = '';
      let foundChord = false;
      let trailingText = '';
      for (const seg of line.segments) {
        if (seg.marker === 'to_coda') {
          if (lineChords.length) lineChords[lineChords.length - 1].codaMarkerAfter = true;
          else gridCodaMarkerPending = true;
        } else if (seg.chord) {
          if (trailingText && lineChords.length) {
            lineChords[lineChords.length - 1].text += trailingText;
            trailingText = '';
          }
          const name = ChordLibrary.transposeChord(seg.chord, semitones, useFlats);
          const hasBeats = seg.beats > 0;
          const beats = hasBeats ? seg.beats : 1;
          if (!hasBeats) hasMissingBeats = true;
          const chordObj = { name, beats, hasBeats, text: seg.text || '', voicingIndex: seg.voicingIndex };
          if (gridCodaMarkerPending) { chordObj.codaMarkerBefore = true; gridCodaMarkerPending = false; }
          lineChords.push(chordObj);
          foundChord = true;
        } else if (seg.text) {
          if (!foundChord) leadingText += seg.text;
          else trailingText += seg.text;
        }
      }
      if (trailingText && lineChords.length) {
        lineChords[lineChords.length - 1].text += trailingText;
      }
      if (lineChords.length) {
        lineChords._leadingText = leadingText;
        current.inputLines.push(lineChords);
      }
    }
  }
  flushSection();

  if (hasMissingBeats) {
    const warn = document.createElement('div');
    warn.className = 'ireal-warning';
    warn.innerHTML = 'Some chords have no beat count &mdash; defaulting to 1 beat per chord. Use <code>[Chord:N]</code> to set beats (e.g. <code>[Cm7:2]</code> = 2 beats, <code>[G7:0.5]</code> = half beat).';
    output.appendChild(warn);
  }

  const timeLabel = song.time ? song.time.beats + '/' + song.time.noteValue : '4/4';

  const container = document.createElement('div');
  container.className = 'ireal-container';

  for (const section of sections) {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'ireal-section';

    if (section.label) {
      const label = document.createElement('div');
      label.className = 'ireal-section-label';
      label.textContent = section.label;
      if (/^(coda|outro)$/i.test(section.label)) label.classList.add('coda-section-label');
      sectionDiv.appendChild(label);
    }

    const grid = document.createElement('div');
    grid.className = 'ireal-grid';
    if (chartMode) grid.classList.add('chart-mode');

    if (section === sections[0]) {
      const timeSig = document.createElement('div');
      timeSig.className = 'ireal-time-sig';
      timeSig.textContent = timeLabel;
      grid.appendChild(timeSig);
    }

    const fontSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--dynamic-font-size'));
    let MEASURES_PER_ROW = 4;
    if (currentTuning === 'BOTH') {
      MEASURES_PER_ROW = fontSize >= 24 ? 2 : fontSize >= 16 ? 3 : 4;
    } else {
      MEASURES_PER_ROW = fontSize >= 28 ? 2 : fontSize >= 22 ? 3 : 4;
    }
    const allChords = [];
    for (const line of section.inputLines) {
      for (let i = 0; i < line.length; i++) {
        const ch = Object.assign({}, line[i]);
        if (i === 0 && line._leadingText) ch.leadingText = line._leadingText;
        allChords.push(ch);
      }
    }

    let row = document.createElement('div');
    row.className = 'ireal-row';
    let lyricRow = showLyrics ? document.createElement('div') : null;
    if (lyricRow) lyricRow.className = 'ireal-lyric-row';
    let measureEl = document.createElement('div');
    measureEl.className = 'ireal-measure';
    let lyricMeasureEl = showLyrics ? document.createElement('div') : null;
    if (lyricMeasureEl) lyricMeasureEl.className = 'ireal-lyric-measure';
    let measureBeats = 0;
    let measuresInRow = 0;

    function flushMeasure() {
      row.appendChild(measureEl);
      if (lyricRow) lyricRow.appendChild(lyricMeasureEl);
      measuresInRow++;
      measureEl = document.createElement('div');
      measureEl.className = 'ireal-measure';
      if (showLyrics) {
        lyricMeasureEl = document.createElement('div');
        lyricMeasureEl.className = 'ireal-lyric-measure';
      }
      measureBeats = 0;
      if (measuresInRow >= MEASURES_PER_ROW) {
        grid.appendChild(row);
        if (lyricRow) grid.appendChild(lyricRow);
        row = document.createElement('div');
        row.className = 'ireal-row';
        if (showLyrics) {
          lyricRow = document.createElement('div');
          lyricRow.className = 'ireal-lyric-row';
        }
        measuresInRow = 0;
      }
    }

    let lastLyricCell = null;
    for (const ch of allChords) {
      if (ch.codaMarkerBefore) {
        const marker = document.createElement('span');
        marker.className = 'coda-marker';
        marker.textContent = '\u{1F441} Coda';
        measureEl.appendChild(marker);
      }
      chordToPlayIndex[logicalChordIndex] = playIndex;
      logicalChordIndex++;
      if (showLyrics && ch.leadingText) {
        if (lastLyricCell) {
          const existing = lastLyricCell.textContent;
          lastLyricCell.textContent = '';
          lastLyricCell.style.display = 'flex';
          lastLyricCell.style.justifyContent = 'space-between';
          const left = document.createElement('span');
          left.textContent = existing;
          const right = document.createElement('span');
          right.className = 'ireal-lyric-leading';
          right.textContent = ch.leadingText.trim();
          lastLyricCell.appendChild(left);
          lastLyricCell.appendChild(right);
        } else {
          const tag = document.createElement('div');
          tag.className = 'ireal-lyric-left';
          tag.textContent = ch.leadingText.trim();
          lyricRow.appendChild(tag);
        }
      }
      let remaining = ch.beats;
      let lyricUsed = false;
      let lastCellMeasure = measureEl;
      while (remaining > 0) {
        const space = beatsPerMeasure - measureBeats;
        const take = Math.min(remaining, space);

        const cell = document.createElement('div');
        cell.className = 'ireal-cell';
        cell.setAttribute('data-play-index', playIndex);
        cell.setAttribute('data-play-beats', take);
        playIndex++;
        if (!ch.hasBeats) cell.classList.add('no-beats');
        if (take < 1) cell.classList.add('half-beat');
        cell.style.flex = take;

        if (chartMode && take >= 1) {
          const label = document.createElement('span');
          label.className = 'ireal-cell-label';
          label.textContent = ch.name;
          cell.appendChild(label);
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          const frets = ChordLibrary.getChordFrets(ch.name, currentTuning, ch.voicingIndex || 0);
          ChordRenderer.render(svg, ch.name, frets, currentTuning, { hideLabel: true });
          svg.classList.add('ireal-cell-diagram');
          cell.appendChild(svg);
        } else {
          cell.textContent = ch.name;
        }
        measureEl.appendChild(cell);
        lastCellMeasure = measureEl;

        if (showLyrics) {
          const lyricCell = document.createElement('div');
          lyricCell.className = 'ireal-lyric-cell';
          lyricCell.style.flex = take;
          if (!lyricUsed) {
            lyricCell.textContent = ch.text.trim();
            lyricUsed = true;
          }
          lyricMeasureEl.appendChild(lyricCell);
          lastLyricCell = lyricCell;
        }

        measureBeats += take;
        remaining -= take;

        if (measureBeats >= beatsPerMeasure) flushMeasure();
      }
      if (ch.codaMarkerAfter) {
        const marker = document.createElement('span');
        marker.className = 'coda-marker';
        marker.textContent = '\u{1F441} Coda';
        lastCellMeasure.appendChild(marker);
      }
    }
    if (measureBeats > 0) {
      row.appendChild(measureEl);
      if (lyricRow) lyricRow.appendChild(lyricMeasureEl);
    }
    if (row.children.length > 0) {
      grid.appendChild(row);
      if (lyricRow) grid.appendChild(lyricRow);
    }

    const allMeasures = grid.querySelectorAll('.ireal-measure');
    for (let i = allMeasures.length - 1; i >= 0; i--) {
      if (allMeasures[i].children.length > 0) {
        allMeasures[i].classList.add('end-double');
        break;
      }
    }

    sectionDiv.appendChild(grid);
    container.appendChild(sectionDiv);
  }

  output.appendChild(container);
}

// --- Editor highlight overlay ---
function updateEditorHighlight() {
  const textarea = document.getElementById('chordProInput');
  const highlight = document.getElementById('editorHighlight');
  const text = textarea.value;
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  highlight.innerHTML = escaped.replace(/\[([^\]]+)\]/g, '<span class="chord-hl">[$1]</span>') + '\n';
  highlight.scrollTop = textarea.scrollTop;
}

// --- Editor chord navigation (Ctrl+Arrow) ---
function getChordPositions(text) {
  const positions = [];
  const regex = /\[[^\]]+\]/g;
  let m;
  while ((m = regex.exec(text)) !== null) {
    positions.push({ start: m.index, end: m.index + m[0].length });
  }
  return positions;
}

function navigateChord(textarea, direction) {
  const pos = textarea.selectionStart;
  const chords = getChordPositions(textarea.value);
  if (!chords.length) return;

  if (direction > 0) {
    for (const ch of chords) {
      if (ch.start > pos) { textarea.selectionStart = textarea.selectionEnd = ch.start; return; }
    }
    textarea.selectionStart = textarea.selectionEnd = chords[0].start;
  } else {
    for (let i = chords.length - 1; i >= 0; i--) {
      if (chords[i].start < pos) { textarea.selectionStart = textarea.selectionEnd = chords[i].start; return; }
    }
    textarea.selectionStart = textarea.selectionEnd = chords[chords.length - 1].start;
  }
}


// --- Init ---
const chordInput = document.getElementById('chordProInput');

chordInput.addEventListener('input', () => {
  updateEditorHighlight();
  renderSong();
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(syncEditorToLibrary, 500);
});

chordInput.addEventListener('scroll', () => {
  document.getElementById('editorHighlight').scrollTop = chordInput.scrollTop;
});

chordInput.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'ArrowRight') {
    e.preventDefault();
    navigateChord(chordInput, 1);
  } else if (e.ctrlKey && e.key === 'ArrowLeft') {
    e.preventDefault();
    navigateChord(chordInput, -1);
  }
});

loadLibrary();
loadRemoteSongs();
updateEditorHighlight();
setTuning(currentTuning);
</script>
