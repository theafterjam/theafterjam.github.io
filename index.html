<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c3e50">
<title>The After Jam — ChordPro Viewer</title>
<style>
  :root { --bg: #fafaf7; --card: #fff; --border: #ddd; --accent: #5b7a3a; --accent-hover: #4a6630; --text: #333; --dynamic-font-size: 20px; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  .app-layout { display: flex; height: 100vh; }

  /* === Sidebar === */
  .sidebar { width: 260px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.25s ease; }
  .sidebar-header { padding: 16px 18px; background: #1a252f; font-size: 1.1em; font-weight: 700; letter-spacing: 0.5px; }
  .sidebar-actions { padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid #34495e; }
  .sidebar-actions button { flex: 1; padding: 7px; cursor: pointer; border: none; border-radius: 4px; color: #fff; font-size: 0.82em; font-weight: 600; }
  .btn-import { background: #3498db; }
  .btn-import:hover { background: #2980b9; }
  .btn-save { background: #27ae60; }
  .btn-save:hover { background: #219a52; }
  .sidebar-search { padding: 8px 12px; background: #1a252f; }
  .sidebar-search input { width: 100%; padding: 7px 10px; border-radius: 4px; border: none; background: #34495e; color: #fff; outline: none; font-size: 0.85em; }
  .sidebar-search input::placeholder { color: #95a5a6; }
  #songList { flex-grow: 1; overflow-y: auto; list-style: none; }
  #songList li { padding: 10px 14px; border-bottom: 1px solid #34495e; cursor: pointer; transition: background 0.15s; line-height: 1.3; display: flex; align-items: flex-start; }
  #songList li:hover { background: #34495e; }
  #songList li.active { background: #3e5871; border-left: 3px solid #3498db; }
  .song-info { flex: 1; min-width: 0; }
  #songList .song-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9em; }
  #songList .song-artist { font-size: 0.75em; color: #bdc3c7; margin-top: 2px; }
  .song-delete { background: none; border: none; color: #7f8c8d; cursor: pointer; font-size: 1.1em; padding: 2px 6px; line-height: 1; flex-shrink: 0; margin-left: 4px; border-radius: 3px; }
  .song-delete:hover { color: #e74c3c; background: rgba(231,76,60,0.1); }
  .sidebar-empty { padding: 20px !important; color: #7f8c8d; font-style: italic; font-size: 0.85em; text-align: center; display: block !important; cursor: default !important; }

  /* === Main content === */
  .main-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 10; }
  .toolbar label { font-size: 0.82em; font-weight: 600; }
  select, button { font-size: 0.82em; padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.toolbar-btn { background: #95a5a6; color: #fff; border-color: #95a5a6; }
  button.toolbar-btn:hover { background: #7f8c8d; }
  .size-control { display: flex; align-items: center; gap: 4px; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .size-control input[type="range"] { width: 55px; cursor: pointer; }
  .scroll-control input[type="range"] { width: 50px; cursor: pointer; }
  .mixer-control { display: flex; flex-direction: column; gap: 2px; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .mixer-row { display: flex; align-items: center; gap: 4px; }
  .mixer-row label { font-size: 0.75em; font-weight: 600; min-width: 3em; }
  .mixer-row input[type="range"] { width: 60px; cursor: pointer; }
  .mixer-row select { font-size: 0.75em; padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); }
  .transpose-control { display: flex; align-items: center; gap: 3px; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .transpose-control button { border: none; background: none; cursor: pointer; font-weight: bold; padding: 0 5px; font-size: 0.95em; }
  .advanced-controls { display: none; flex-wrap: wrap; gap: 10px; align-items: center; flex-basis: 100%; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }
  .advanced-controls.visible { display: flex; }
  .btn-advanced { background: none; border: 1px solid var(--border); border-radius: 4px; font-size: 0.75em; padding: 4px 8px; cursor: pointer; color: #777; }
  .btn-advanced:hover { background: #f0f0f0; color: #333; }
  .btn-advanced.active { color: var(--accent); border-color: var(--accent); }
  #transposeValue { font-size: 0.85em; font-weight: 700; min-width: 18px; text-align: center; color: #3498db; }

  .toolbar-group { display: flex; align-items: center; gap: 3px; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .toolbar-group button { border: none; background: none; cursor: pointer; padding: 2px 7px; font-size: 0.82em; font-weight: 600; border-radius: 3px; color: var(--text); }
  .toolbar-group button.active { background: var(--accent); color: #fff; }

  .scroll-control { display: flex; align-items: center; gap: 3px; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
  .scroll-control button { border: none; background: none; cursor: pointer; font-weight: bold; padding: 0 5px; font-size: 0.95em; }
  .scroll-play { color: #27ae60; font-size: 1em; }
  .scroll-play.playing { color: #e74c3c; }
  #scrollSpeed { font-size: 0.85em; font-weight: 700; min-width: 18px; text-align: center; color: #3498db; }

  /* === Floating scroll bar === */
  .float-scroll { display: none; position: sticky; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 50; background: rgba(44,62,80,0.92); color: #fff; border-radius: 24px; padding: 8px 18px; gap: 10px; align-items: center; box-shadow: 0 4px 16px rgba(0,0,0,0.3); width: fit-content; margin: 0 auto; pointer-events: auto; }
  .float-scroll.visible { display: flex; }
  .float-scroll button { border: none; background: none; color: #fff; cursor: pointer; font-size: 1em; padding: 2px 8px; font-weight: bold; }
  .float-scroll button:hover { color: #3498db; }
  .float-scroll .float-stop { color: #e74c3c; font-size: 1.1em; }
  .float-scroll .float-top { color: #f39c12; }
  .float-scroll .float-speed { font-size: 0.85em; font-weight: 700; min-width: 14px; text-align: center; }
  .float-scroll .float-label { font-size: 0.75em; opacity: 0.7; }
  .float-chord-name { font-weight: 700; color: #3498db; min-width: 3em; text-align: center; }
  .chord-playing { background: rgba(52, 152, 219, 0.25); border-radius: 4px; outline: 2px solid #3498db; outline-offset: 1px; }
  .chord-playing-alt { background: rgba(155, 89, 182, 0.25); border-radius: 4px; outline: 2px solid #9b59b6; outline-offset: 1px; }
  .dual-tuning { display: grid; grid-template-columns: 1fr 3px 1fr; gap: 0; }
  .dual-tuning-divider { background: #2c3e50; }
  .dual-tuning-pane { overflow: hidden; padding: 0 16px; }
  .tuning-float-header { display: none; position: sticky; top: 42px; z-index: 8; background: #2c3e50; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  .tuning-float-header.visible { display: grid; }
  .tuning-float-header.single { grid-template-columns: 1fr; }
  .tuning-float-header.dual { grid-template-columns: 1fr 1px 1fr; gap: 0; }
  .tuning-float-header .tuning-header-label { font-weight: 700; font-size: 1.3em; color: #fff; padding: 8px 16px; text-align: center; }
  .tuning-float-header .tuning-header-divider { background: rgba(255,255,255,0.5); width: 3px; }
  .dual-tuning-pane-header { display: none; }
  .beat-dots { display: flex; gap: 4px; align-items: center; }
  .beat-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: background 0.05s, transform 0.05s; }
  .beat-dot.active { background: #3498db; transform: scale(1.4); }
  .float-scroll select { font-size: 0.75em; padding: 2px 4px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
  .float-scroll input[type="range"] { width: 40px; cursor: pointer; accent-color: #3498db; }
  .float-pass-display { font-size: 0.8em; font-weight: 700; color: #f39c12; min-width: 2em; text-align: center; }
  .analysis-label { display: none; font-size: 0.6em; color: #e67e22; font-weight: 600; line-height: 1.2; }
  .analysis-key { display: none; font-size: 0.55em; color: #8e44ad; font-style: italic; line-height: 1.2; }
  #output.show-analysis .analysis-label,
  #output.show-analysis .analysis-key { display: block; }
  .coda-marker { font-size: 0.7em; color: #e67e22; font-weight: 700; margin: 0 2px; vertical-align: super; transition: opacity 0.2s; }
  .coda-marker.flash, .coda-section-label.flash { animation: codaFlash 0.5s ease-in-out infinite; }
  @keyframes codaFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

  #editArea { display: none; padding: 0 20px 12px; position: sticky; top: 52px; z-index: 9; background: var(--bg); }
  .editor-wrap { position: relative; width: 100%; height: 200px; }
  .editor-wrap .editor-highlight, .editor-wrap textarea {
    font-family: 'Consolas', 'Courier New', monospace; font-size: 0.88em; padding: 10px;
    border: 1px solid #3498db; border-radius: 6px; width: 100%; height: 100%;
    white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; line-height: 1.5; box-sizing: border-box;
    margin: 0;
  }
  .editor-wrap .editor-highlight {
    position: absolute; top: 0; left: 0; pointer-events: none; background: #ebf5fb; color: #333;
  }
  .editor-wrap .editor-highlight .chord-hl { color: #1a5276; background: #d4e6f1; border-radius: 3px; }
  .editor-wrap textarea {
    position: relative; z-index: 1; background: transparent; color: transparent; caret-color: #333;
    resize: none;
  }
  .editor-nav-hint { font-size: 0.7em; color: #888; margin-top: 4px; }

  #output { background: var(--card); padding: 20px; flex-grow: 1; font-size: var(--dynamic-font-size); }
  .song-title-display { font-size: 1.6em; font-weight: bold; margin-bottom: 2px; }
  .song-meta { font-size: 0.85em; color: #666; margin-bottom: 14px; }
  .chord-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding: 10px; background: #f5f5f0; border-radius: 6px; }
  .chord-diagram { flex: 0 0 auto; }
  .line-wrap { margin-bottom: 12px; break-inside: avoid; }
  .chord-pair { display: inline-block; vertical-align: bottom; }
  .chord-pair .chord { color: var(--accent); font-weight: bold; font-size: 1em; white-space: pre; min-height: 1.2em; display: block; padding-right: 0.5em; }
  .chord-pair .lyric { white-space: pre; display: block; }
  .chord-chart-label { display: block; color: var(--accent); font-weight: bold; font-size: 0.9em; white-space: nowrap; }
  .chord-pair .chord-inline-diagram { display: block; width: 2.8em; height: auto; margin: -0.6em 0 0 -0.45em; }
  .chord-anticipate .lyric { padding-left: 1.5em; }
  .chord-anticipate.chord-pair:has(.chord-inline-diagram) .lyric { padding-left: 3em; }
  .directive-line { font-style: italic; color: #888; margin: 10px 0 4px; break-inside: avoid; }
  .section-label { font-weight: 700; color: #555; margin: 16px 0 6px; display: block; text-transform: capitalize; font-size: 0.95em; break-inside: avoid; break-after: avoid; }

  /* === Column layout === */
  #output.cols-2 { column-count: 2; column-gap: 28px; }
  #output.cols-3 { column-count: 3; column-gap: 22px; }

  /* === iReal Pro grid === */
  .ireal-container { max-width: 56em; }
  .ireal-warning { background: #fef9e7; border: 1px solid #f0e6b2; border-radius: 6px; padding: 0.5em 0.9em; margin-bottom: 1em; font-size: 0.7em; color: #7d6608; line-height: 1.4; }
  .ireal-warning code { background: #f7f1d4; padding: 1px 4px; border-radius: 3px; font-family: 'Consolas', monospace; }
  .ireal-section { margin-bottom: 1.2em; break-inside: avoid; }
  .ireal-section-label { display: inline-block; background: #34495e; color: #fff; padding: 0.2em 0.8em; border-radius: 4px; font-weight: 700; font-size: 0.7em; margin-bottom: 0.5em; text-transform: capitalize; letter-spacing: 0.5px; }
  .ireal-grid { border: none; position: relative; margin-left: 2.5em; }
  .ireal-time-sig { position: absolute; top: 0; left: -2.2em; font-weight: 700; font-size: 0.75em; color: #444; line-height: 2.5em; }
  .ireal-row { display: flex; padding: 0.15em 0; }
  .ireal-measure { display: flex; flex: 1 1 0; min-height: 2.5em; position: relative; min-width: 0; overflow: hidden; }
  .ireal-measure::before { content: ''; position: absolute; left: 0; top: 0.25em; bottom: 0.25em; border-left: 0.07em solid #444; }
  .ireal-measure:last-child::after { content: ''; position: absolute; right: 0; top: 0.25em; bottom: 0.25em; border-right: 0.07em solid #444; }
  .ireal-row:first-child .ireal-measure:first-of-type::before { border-left: 0.22em double #444; }
  .ireal-measure.end-double::after { content: ''; position: absolute; right: 0; top: 0.25em; bottom: 0.25em; border-right: 0.22em double #444; }
  .ireal-cell { padding: 0.5em 0.35em; font-weight: 700; font-size: 1.05em; color: var(--accent); min-height: 2.5em; display: flex; align-items: center; justify-content: flex-start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ireal-cell.half-beat { font-size: 0.85em; padding: 0.5em 0.15em; }
  .ireal-cell.no-beats { color: #c0392b; background: #fdf2f2; }
  .ireal-grid.chart-mode .ireal-cell { min-height: 5em; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding-top: 0.2em; padding-bottom: 0; }
  .ireal-cell-label { font-size: 0.9em; font-weight: 700; color: var(--accent); white-space: nowrap; margin-left: 0.3em; line-height: 1; }
  .ireal-cell-diagram { width: 3.5em; height: auto; display: block; margin-top: -0.4em; margin-left: -0.3em; }
  .ireal-lyric-row { display: flex; position: relative; }
  .ireal-lyric-measure { display: flex; flex: 1 1 0; }
  .ireal-lyric-cell { font-size: 0.7em; color: #222; padding: 0 0.25em 0.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -0.3em; }
  .ireal-lyric-leading { color: #222; text-align: right; }
  .ireal-lyric-left { position: absolute; right: 100%; padding-right: 0.4em; font-size: 0.8em; color: #222; white-space: nowrap; text-align: right; }

  /* === Mobile sidebar === */
  .sidebar-toggle { display: none; position: fixed; top: 8px; left: 8px; z-index: 200; background: #2c3e50; color: #fff; border: none; border-radius: 6px; padding: 8px 11px; cursor: pointer; font-size: 1.2em; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 90; }

  /* === Mobile toolbar === */
  .mobile-toolbar { display: none; padding: 8px 12px 8px 52px; border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 10; align-items: center; gap: 8px; }
  .mobile-toolbar button { font-size: 1em; padding: 6px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--card); cursor: pointer; }
  .mobile-toolbar .mobile-play { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 1.1em; }
  .mobile-toolbar .mobile-play.playing { background: #e74c3c; border-color: #e74c3c; }
  .mobile-toolbar .mobile-settings { background: #95a5a6; color: #fff; border-color: #95a5a6; }
  .mobile-settings-panel { display: none; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 12px 12px 52px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 42px; z-index: 9; }
  .mobile-settings-panel.visible { display: flex; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: block; }
    .sidebar-overlay.active { display: block; }
    .toolbar { display: none; }
    .mobile-toolbar { display: flex; }
    .tuning-float-header { top: 42px; }
    #songList li { padding: 12px 14px; }
    .song-delete { padding: 4px 8px; font-size: 1.2em; }
    #editArea { top: 42px; }
  }

  @media print {
    .sidebar, .toolbar, #editArea, #filePicker, .sidebar-toggle, .sidebar-overlay, .float-scroll { display: none !important; }
    body { overflow: visible; height: auto; }
    .app-layout { display: block; height: auto; }
    .main-content { overflow: visible; }
    #output { font-size: var(--dynamic-font-size) !important; padding: 0; box-shadow: none; }
    #output.cols-2 { column-count: 2; column-gap: 24px; }
    #output.cols-3 { column-count: 3; column-gap: 20px; }
    .chord-pair, .line-wrap { break-inside: avoid; page-break-inside: avoid; }
    .ireal-section { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<button class="sidebar-toggle" onclick="toggleMobileSidebar()" aria-label="Toggle sidebar">&#9776;</button>
<div class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">MY LIBRARY</div>
    <div class="sidebar-actions">
      <button class="btn-import" onclick="document.getElementById('filePicker').click()">Import</button>
      <button class="btn-save" onclick="saveAsFile()">Save</button>
      <input type="file" id="filePicker" accept=".txt,.pro,.chopro" style="display:none" onchange="handleFileSelect(this)" multiple>
    </div>
    <div class="sidebar-search">
      <input type="text" id="sidebarSearch" placeholder="Search title or artist..." oninput="updateSidebar()">
    </div>
    <ul id="songList">
      <li class="sidebar-empty">No songs imported yet.</li>
    </ul>
  </aside>

  <div class="main-content">
    <div class="toolbar">
      <label>Tuning:</label>
      <select id="tuningSelect" onchange="setTuning(this.value)">
        <option value="GCEA" selected>Standard (GCEA)</option>
        <option value="DGBE">Baritone (DGBE)</option>
        <option value="BOTH">Both (side by side)</option>
      </select>

      <div class="transpose-control">
        <label>Transpose:</label>
        <button onclick="transposeStep(-1)">&minus;</button>
        <span id="transposeValue">0</span>
        <button onclick="transposeStep(1)">+</button>
      </div>

      <div class="toolbar-group">
        <label>Layout:</label>
        <button id="layoutLyricsBtn" class="active" onclick="setLayout('lyrics')">Lyrics</button>
        <button id="layoutGridBtn" onclick="setLayout('grid')">Grid</button>
      </div>

      <div class="toolbar-group" id="chordFormatGroup">
        <label>Chords:</label>
        <button id="chordTextBtn" class="active" onclick="setChordFormat('text')">Text</button>
        <button id="chordChartBtn" onclick="setChordFormat('chart')">Chart</button>
      </div>

      <label id="gridLyricsLabel" style="display:none"><input type="checkbox" id="gridLyricsToggle" checked onchange="renderSong()"> Lyrics</label>

      <div class="toolbar-group" id="colsGroup">
        <label>Cols:</label>
        <button id="col1Btn" class="active" onclick="setColumns(1)">1</button>
        <button id="col2Btn" onclick="setColumns(2)">2</button>
        <button id="col3Btn" onclick="setColumns(3)">3</button>
      </div>

      <div class="size-control">
        <label>Size:</label>
        <input type="range" min="10" max="36" value="20" oninput="updateFontSize(this.value)">
      </div>

      <button class="toolbar-btn" onclick="fitToPage()">Fit</button>

      <div class="scroll-control">
        <label>Scroll:</label>
        <button onclick="adjustScrollSpeed(-1)">&minus;</button>
        <span id="scrollSpeed">0</span>
        <button onclick="adjustScrollSpeed(1)">+</button>
        <button class="scroll-play" id="scrollPlayBtn" onclick="toggleAutoScroll()">&#9654;</button>
      </div>

      <div class="scroll-control">
        <label>Tempo:</label>
        <button onclick="adjustTempo(-5)">&minus;</button>
        <span id="tempoDisplay">120</span>
        <button onclick="adjustTempo(5)">+</button>
        <label>bpm</label>
        <select id="rhythmSelect" onchange="setRhythm(this.value)" title="Rhythm feel">
          <option value="swing">Swing</option>
          <option value="bossa">Bossa Nova</option>
        </select>
        <button class="scroll-play" id="playbackBtn" onclick="togglePlayback()">&#9654;</button>
      </div>
      <button class="toolbar-btn" id="editToggleBtn" onclick="toggleEditArea()">Edit Song</button>
      <button class="btn-advanced" id="advancedToggleBtn" onclick="toggleAdvanced()">Advanced &#9662;</button>

      <div class="advanced-controls" id="advancedControls">
        <div class="mixer-control">
          <div class="mixer-row"><label>Click</label><input type="range" min="0" max="100" value="50" id="clickVol" oninput="setClickVolume(this.value/100)" title="Click volume"></div>
          <div class="mixer-row"><label>Drums</label><input type="range" min="0" max="100" value="80" id="drumVol" oninput="setDrumVolume(this.value/100)" title="Drum volume"></div>
          <div class="mixer-row"><label>Bass</label><input type="range" min="0" max="100" value="80" id="bassVol" oninput="setBassVolume(this.value/100)" title="Bass volume"><select id="bassSelect" onchange="setBassMode(this.value)" title="Bass complexity"><option value="head">Head</option><option value="solo">Solo</option></select></div>

    let idx = NOTES_SHARP.indexOf(root);

    if (root === 'F#') return 6;

      quality = name.substring(2);
    } else {
      root = name[0];

    const rootIndex = normalizeRootIndex(root);
    if (rootIndex < 0) return null;
    return { root, quality, rootIndex };

    'Ab9': [[3,3,2,3], [5,6,6,6]],
    'A9':  [[0,1,0,2], [4,4,3,4]],
    'Bb9': [[1,2,1,3], [5,5,4,5]],
    'B9':  [[2,3,2,4], [6,6,5,6]],

    // === Major 9 ===
    'Cmaj9': [[0,2,0,2], [4,4,3,5], [4,2,0,3]],

    // === Minor 9 ===
    'Cm9':  [[5,3,6,5], [3,3,3,5]],
    'Dbm9': [[6,4,7,6], [4,4,4,6]],
    'Dm9':  [[7,5,8,7], [5,5,0,0]],
    'Ebm9': [[8,6,9,8], [3,5,2,4]],
    'Em9':  [[0,2,2,2]],
    'Fm9':  [[1,3,3,3]],
    'F#m9': [[2,4,4,4]],
    'Gm9':  [[3,2,1,0]],
    'Abm9': [[4,3,2,1]],
    'Am9':  [[2,0,3,2], [0,0,0,2]],
    'Bbm9': [[3,1,4,3], [1,1,1,3]],
    'Bm9':  [[4,2,5,4], [2,2,2,4]],

    // === Minor 11 ===
    'Cm11':  [[3,3,1,3]],
    'Dbm11': [[4,4,2,4]],
    'Dm11':  [[0,2,1,3], [0,0,1,0]],
    'Ebm11': [[1,3,2,4], [1,1,2,1]],
    'Em11':  [[0,2,0,0], [2,2,3,2]],
    'Fm11':  [[1,3,1,1], [3,3,4,3]],
    'F#m11': [[4,4,2,0], [4,4,5,4]],
    'Gm11':  [[0,0,1,1]],
    'Abm11': [[1,1,2,2]],
    'Am11':  [[2,2,3,3]],
    'Bbm11': [[3,3,4,4]],
    'Bm11':  [[4,2,0,0]],

    // === Dominant 7 Sus ===
    'C7sus':  [[0,0,1,1]],
    'Db7sus': [[1,1,2,2]],
    'D7sus':  [[2,2,3,3]],
    'Eb7sus': [[3,3,4,4]],
    'E7sus':  [[4,2,0,0], [4,4,5,5]],
    'F7sus':  [[3,3,1,3]],
    'F#7sus': [[4,4,2,4]],
    'G7sus':  [[0,2,1,3]],
    'Ab7sus': [[1,3,2,4]],
    'A7sus':  [[0,2,0,0]],
    'Bb7sus': [[1,3,1,1]],
    'B7sus':  [[4,4,2,0], [2,4,2,2]],

    // === Minor add 9 ===
    'Cm+9':  [[5,3,3,5]],
    'Dbm+9': [[6,4,4,6]],
    'Dm+9':  [[7,5,5,7]],
    'Ebm+9': [[8,6,6,8]],
    'Em+9':  [[0,4,2,2]],
    'Fm+9':  [[1,5,3,3]],
    'F#m+9': [[1,1,2,0]],
    'Gm+9':  [[2,2,3,1]],
    'Abm+9': [[3,3,4,2]],
    'Am+9':  [[2,0,0,2]],
    'Bbm+9': [[3,1,1,3]],
    'Bm+9':  [[4,2,2,4]]
  };

  function resolveKey(parsed, tuning) {
    let rootIndex = parsed.rootIndex;
    if (tuning === 'DGBE') rootIndex = (rootIndex + 5) % 12;
    return CHORD_KEYS[rootIndex] + parsed.quality;
  }

  function getChordFrets(name, tuning, voicingIndex) {
    const parsed = parseChord(name);
    if (!parsed) return null;
    const key = resolveKey(parsed, tuning);
    const voicings = CHORDS[key];
    if (!voicings) {
      const slashIdx = key.indexOf('/');
      if (slashIdx > 0) {
        const base = CHORDS[key.substring(0, slashIdx)];
        if (base) return base[(voicingIndex || 0) % base.length];
      }
      return null;
    }
    return voicings[(voicingIndex || 0) % voicings.length];
  }

  function getAllVoicings(name, tuning) {
    const parsed = parseChord(name);
    if (!parsed) return null;
    const key = resolveKey(parsed, tuning);
    return CHORDS[key] || null;
  }

  function getVoicingCount(name, tuning) {
    const voicings = getAllVoicings(name, tuning);
    return voicings ? voicings.length : 0;
  }

  return {
    NOTES_SHARP, NOTES_FLAT, TUNING_LABELS,
    parseChord, transposeChord, getChordFrets,
    getAllVoicings, getVoicingCount
  };
})();

<script>
const ChordRenderer = (() => {
  const DIAGRAM_W = 70;
  const DIAGRAM_H = 80;
  const FRETS_SHOWN = 4;
  const NUM_STRINGS = 4;
  const TOP_MARGIN = 16;
  const BOTTOM_MARGIN = 6;
  const SIDE_MARGIN = 18;
  const FRET_AREA_TOP = TOP_MARGIN;
  const FRET_AREA_H = DIAGRAM_H - TOP_MARGIN - BOTTOM_MARGIN;
  const STRING_SPACING = (DIAGRAM_W - 2 * SIDE_MARGIN) / (NUM_STRINGS - 1);
  const FRET_SPACING = FRET_AREA_H / FRETS_SHOWN;
  const DOT_R = 4;

  function render(svgEl, chordName, frets, tuning, options) {
    const showLabel = !(options && options.hideLabel);
    svgEl.setAttribute('viewBox', `0 0 ${DIAGRAM_W} ${DIAGRAM_H}`);
    svgEl.setAttribute('width', DIAGRAM_W);
    svgEl.setAttribute('height', DIAGRAM_H);
    svgEl.innerHTML = '';

    if (!frets) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', DIAGRAM_W / 2);
      txt.setAttribute('y', DIAGRAM_H / 2);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '8');
      txt.setAttribute('fill', '#999');
      txt.textContent = chordName;
      svgEl.appendChild(txt);
      return;
    }

    const minFret = Math.min(...frets.filter(f => f > 0));
    const maxFret = Math.max(...frets.filter(f => f > 0));
    let startFret = 1;
    if (maxFret > FRETS_SHOWN) {
      startFret = minFret;
    }

    const stringLabels = ChordLibrary.TUNING_LABELS[tuning] || ChordLibrary.TUNING_LABELS.GCEA;

    for (let i = 0; i <= FRETS_SHOWN; i++) {
      const y = FRET_AREA_TOP + i * FRET_SPACING;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', SIDE_MARGIN);
      line.setAttribute('x2', SIDE_MARGIN + (NUM_STRINGS - 1) * STRING_SPACING);
      line.setAttribute('y1', y);
      line.setAttribute('y2', y);
      if (i === 0 && startFret === 1) {
        line.setAttribute('stroke', '#222');
        line.setAttribute('stroke-width', '4');
      } else {
        line.setAttribute('stroke', '#999');
        line.setAttribute('stroke-width', '0.8');
      }
      svgEl.appendChild(line);
    }

    for (let i = 0; i < NUM_STRINGS; i++) {
      const x = SIDE_MARGIN + i * STRING_SPACING;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x);
      line.setAttribute('x2', x);
      line.setAttribute('y1', FRET_AREA_TOP);
      line.setAttribute('y2', FRET_AREA_TOP + FRETS_SHOWN * FRET_SPACING);
      line.setAttribute('stroke', '#666');
      line.setAttribute('stroke-width', '1');
      svgEl.appendChild(line);
    }

    if (startFret > 1) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', SIDE_MARGIN - 6);
      t.setAttribute('y', FRET_AREA_TOP + FRET_SPACING / 2 + 4);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '11');
      t.setAttribute('font-weight', 'bold');
      t.setAttribute('fill', '#444');
      t.textContent = startFret;
      svgEl.appendChild(t);
    }

    for (let i = 0; i < NUM_STRINGS; i++) {
      const x = SIDE_MARGIN + i * STRING_SPACING;
      const f = frets[i];

      if (f === 0) {
        // open string — no marker
      } else if (f === -1) {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', x);
        t.setAttribute('y', FRET_AREA_TOP - 3);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '8');
        t.setAttribute('fill', '#333');
        t.textContent = '×';
        svgEl.appendChild(t);
      } else {
        const relFret = f - startFret;
        const cy = FRET_AREA_TOP + relFret * FRET_SPACING + FRET_SPACING / 2;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', DOT_R);
        circle.setAttribute('fill', '#333');
        svgEl.appendChild(circle);
      }
    }

    if (showLabel) {
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', DIAGRAM_W / 2);
      label.setAttribute('y', 9);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-size', '11');
      label.setAttribute('font-weight', 'bold');
      label.setAttribute('fill', '#222');
      label.textContent = chordName;
      svgEl.appendChild(label);
    }
  }

  function createDiagram(chordName, tuning) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('chord-diagram');
    const frets = ChordLibrary.getChordFrets(chordName, tuning);
    render(svg, chordName, frets, tuning);
    return svg;
  }

  function exportPNG(svgEl, fileName) {
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(svgEl);
    const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = () => {
      const scale = 5;
      const canvas = document.createElement('canvas');
      canvas.width = DIAGRAM_W * scale;
      canvas.height = DIAGRAM_H * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const link = document.createElement('a');
      link.download = fileName || 'chord.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  return { render, createDiagram, exportPNG };
})();

<script>
// harmonicAnalysis.js — Key detection and chord function analysis for The After Jam
//
// Analyzes a chord progression to produce per-chord harmonic context:
//   key center, chord function (roman numeral), voice leading hints,
//   and pattern recognition (ii-V-I, tritone subs, etc.)
//
// Runs once per render (not per beat). Results stored as an array
// indexed by logical chord position for use by backing track generators.
//
// Reads from globals: ChordLibrary (parseChord)
// Exposes: HarmonicAnalysis.analyze(song, roadmapSections)

const HarmonicAnalysis = (() => {

  // Major scale intervals from root (in semitones)
  const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
  const MINOR_SCALE = [0, 2, 3, 5, 7, 8, 10]; // natural minor

  // Expected chord quality for each scale degree in major key
  // I=maj, ii=min, iii=min, IV=maj, V=dom, vi=min, vii=dim
  const MAJOR_KEY_QUALITIES = ['maj', 'min', 'min', 'maj', 'dom', 'min', 'dim'];
  // In minor: i=min, ii=dim, III=maj, iv=min, V=dom, VI=maj, vii=dim
  const MINOR_KEY_QUALITIES = ['min', 'dim', 'maj', 'min', 'dom', 'maj', 'dim'];

  function qualityCategory(quality) {
    if (!quality) return 'maj';
    if (quality.includes('dim') || quality.includes('m7b5')) return 'dim';
    if (quality.startsWith('m') && !quality.startsWith('maj')) return 'min';
    if (quality.includes('7') && !quality.includes('maj7')) return 'dom';
    return 'maj';
  }

  function scoreKeyFit(chords, tonicIndex, mode, beats) {
    const scale = mode === 'major' ? MAJOR_SCALE : MINOR_SCALE;
    const expectedQualities = mode === 'major' ? MAJOR_KEY_QUALITIES : MINOR_KEY_QUALITIES;
    let score = 0;

    for (let i = 0; i < chords.length; i++) {
      const chord = chords[i];
      if (!chord) continue;
      const weight = beats ? (beats[i] || 1) : 1;
      const cat = qualityCategory(chord.quality);
      // Diminished chords are symmetrical (repeat every 3 semitones) so they
      // fit multiple keys equally — reduce their influence on key detection
      const dimDiscount = cat === 'dim' ? 0.4 : 1;
      const interval = ((chord.rootIndex - tonicIndex) % 12 + 12) % 12;
      const degreeIdx = scale.indexOf(interval);
      if (degreeIdx >= 0) {
        if (cat === 'dom' && degreeIdx === 4) {
          // V7 that resolves to tonic gets full credit; unresolved V7 gets less
          const next = i + 1 < chords.length ? chords[i + 1] : null;
          const resolves = next && ((next.rootIndex - chord.rootIndex) % 12 + 12) % 12 === 5
            && next.rootIndex === tonicIndex;
          score += (resolves ? 6 : 3) * weight;
        }
        else if (cat === expectedQualities[degreeIdx]) {
          score += 5 * weight * dimDiscount;
          if (degreeIdx === 0) score += 2 * weight;
        }
        else if (cat === 'dom') {
          // Dom7 on a non-V degree — likely secondary dominant, weak evidence
          score += 1 * weight;
        }
        else {
          // Root in scale but wrong quality — partial credit
          score += 2 * weight * dimDiscount;
        }
      }
    }
    return score;
  }

  function detectKeyCenter(chords, beats) {
    if (!chords || chords.length === 0) return { tonic: 0, mode: 'major', confidence: 0 };

    let bestTonic = 0, bestMode = 'major', bestScore = -1;

    for (let tonic = 0; tonic < 12; tonic++) {
      for (const mode of ['major', 'minor']) {
        const score = scoreKeyFit(chords, tonic, mode, beats);
        if (score > bestScore) {
          bestScore = score;
          bestTonic = tonic;
          bestMode = mode;
        }
      }
    }

    const totalBeats = chords.reduce((sum, c, i) => sum + (c ? (beats ? (beats[i] || 1) : 1) : 0), 0);
    const maxPossible = totalBeats * 7;
    const confidence = maxPossible > 0 ? bestScore / maxPossible : 0;
    return { tonic: bestTonic, mode: bestMode, confidence };
  }

  function getScaleDegree(rootIndex, tonicIndex, mode) {
    const scale = mode === 'major' ? MAJOR_SCALE : MINOR_SCALE;
    const interval = ((rootIndex - tonicIndex) % 12 + 12) % 12;
    const idx = scale.indexOf(interval);
    return idx >= 0 ? idx : -1;
  }

  function romanNumeral(degree, quality, mode) {
    const numerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
    if (degree < 0 || degree > 6) return '?';
    const cat = qualityCategory(quality);
    const base = (cat === 'min' || cat === 'dim') ? numerals[degree].toLowerCase() : numerals[degree];
    let suffix = '';
    if (cat === 'dim') suffix = '°';
    else if (cat === 'dom') suffix = '7';
    else if (quality && quality.includes('maj7')) suffix = 'Δ';
    else if (quality && quality.includes('7')) suffix = '7';
    return base + suffix;
  }

  function isSecondaryDominant(chord, nextChord, key) {
    if (!chord || !nextChord) return false;
    const cat = qualityCategory(chord.quality);
    if (cat !== 'dom') return false;
    // If this chord IS the diatonic V of the key, it's a primary dominant, not secondary
    const degreeInKey = getScaleDegree(chord.rootIndex, key.tonic, key.mode);
    if (degreeInKey === 4) return false;
    // V-I resolution: root drops by 5th (7 semitones) or rises by 4th (5 semitones)
    const interval = ((nextChord.rootIndex - chord.rootIndex) % 12 + 12) % 12;
    return interval === 5 || interval === 7;
  }

  function isTritoneSubstitution(chord, nextChord, key) {
    if (!chord || !nextChord) return false;
    const cat = qualityCategory(chord.quality);
    if (cat !== 'dom') return false;
    // Tritone sub resolves down by half step
    const interval = ((nextChord.rootIndex - chord.rootIndex) % 12 + 12) % 12;
    if (interval !== 11) return false;
    // The "normal" V of nextChord would be 7 semitones above nextChord
    // This chord's root is 6 semitones from that normal V (a tritone away)
    return true;
  }

  function detectPatterns(chords) {
    const patterns = new Array(chords.length).fill(null);
    const patternKeys = new Array(chords.length).fill(null);

    // iii-VI-ii-V: four chords, all roots a 4th apart, min-dom-min-dom
    for (let i = 0; i < chords.length - 3; i++) {
      const c1 = chords[i], c2 = chords[i+1], c3 = chords[i+2], c4 = chords[i+3];
      if (!c1 || !c2 || !c3 || !c4) continue;
      const cat1 = qualityCategory(c1.quality);
      const cat2 = qualityCategory(c2.quality);
      const cat3 = qualityCategory(c3.quality);
      const cat4 = qualityCategory(c4.quality);
      if (cat1 !== 'min' || cat2 !== 'dom' || cat3 !== 'min' || cat4 !== 'dom') continue;
      const int12 = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      const int23 = ((c3.rootIndex - c2.rootIndex) % 12 + 12) % 12;
      const int34 = ((c4.rootIndex - c3.rootIndex) % 12 + 12) % 12;
      if (int12 === 5 && int23 === 5 && int34 === 5) {
        // Target key: the chord a 4th above c4 would resolve to
        const targetTonic = (c4.rootIndex + 5) % 12;
        patterns[i] = 'iii'; patterns[i+1] = 'VI'; patterns[i+2] = 'ii'; patterns[i+3] = 'V';
        const pKey = { tonic: targetTonic, mode: 'major', confidence: 1 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey; patternKeys[i+2] = pKey; patternKeys[i+3] = pKey;
      }
    }

    // ii-V-I: interval-based (root motion up a 4th each), min/dim-dom-any
    // Also catches tritone sub variant: ii down a half step to subV, down a half step to I
    for (let i = 0; i < chords.length - 2; i++) {
      if (patterns[i]) continue;
      const c1 = chords[i], c2 = chords[i + 1], c3 = chords[i + 2];
      if (!c1 || !c2 || !c3) continue;
      const cat1 = qualityCategory(c1.quality);
      const cat2 = qualityCategory(c2.quality);
      if ((cat1 !== 'min' && cat1 !== 'dim') || cat2 !== 'dom') continue;
      const int12 = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      const int23 = ((c3.rootIndex - c2.rootIndex) % 12 + 12) % 12;
      if (int12 === 5 && int23 === 5) {
        patterns[i] = 'ii'; patterns[i + 1] = 'V'; patterns[i + 2] = 'I';
        const pKey = { tonic: c3.rootIndex, mode: 'major', confidence: 1 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey; patternKeys[i+2] = pKey;
      } else if (int12 === 11 && int23 === 11) {
        // Tritone sub: ii → subV (half step down) → I (half step down)
        patterns[i] = 'ii'; patterns[i + 1] = 'V'; patterns[i + 2] = 'I';
        const pKey = { tonic: c3.rootIndex, mode: 'major', confidence: 1 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey; patternKeys[i+2] = pKey;
      }
    }

    // ii-V without resolution
    for (let i = 0; i < chords.length - 1; i++) {
      if (patterns[i]) continue;
      const c1 = chords[i], c2 = chords[i + 1];
      if (!c1 || !c2) continue;
      const cat1 = qualityCategory(c1.quality);
      const cat2 = qualityCategory(c2.quality);
      const interval = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      if ((cat1 === 'min' || cat1 === 'dim') && cat2 === 'dom' && interval === 5) {
        patterns[i] = 'ii'; patterns[i + 1] = 'V';
        const targetTonic = (c2.rootIndex + 5) % 12;
        const pKey = { tonic: targetTonic, mode: 'major', confidence: 1 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey;
      }
    }

    // Lone subV: dom7 resolving down a half step (tritone sub without preceding ii)
    for (let i = 0; i < chords.length; i++) {
      if (patterns[i]) continue;
      const c1 = chords[i];
      const c2 = i + 1 < chords.length ? chords[i + 1] : chords[0];
      if (!c1 || !c2) continue;
      const cat1 = qualityCategory(c1.quality);
      if (cat1 !== 'dom') continue;
      const interval = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      if (interval === 11) {
        patterns[i] = 'V';
        const pKey = { tonic: c2.rootIndex, mode: 'major', confidence: 0.9 };
        patternKeys[i] = pKey;
      }
    }

    // I-IV7 in major (maj + dom a 4th above) or i-bVI7 in minor (min + dom a minor 3rd up)
    for (let i = 0; i < chords.length - 1; i++) {
      if (patterns[i]) continue;
      const c1 = chords[i], c2 = chords[i + 1];
      if (!c1 || !c2) continue;
      const cat1 = qualityCategory(c1.quality);
      const cat2 = qualityCategory(c2.quality);
      if (cat2 !== 'dom') continue;
      const interval = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      if (cat1 === 'maj' && interval === 5) {
        // I-IV7: tonic is c1
        patterns[i] = 'I'; patterns[i + 1] = 'IV';
        const pKey = { tonic: c1.rootIndex, mode: 'major', confidence: 0.9 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey;
      } else if (cat1 === 'min' && interval === 8) {
        // i-bVI7: tonic is c1 (minor key)
        patterns[i] = 'i'; patterns[i + 1] = 'bVI';
        const pKey = { tonic: c1.rootIndex, mode: 'minor', confidence: 0.9 };
        patternKeys[i] = pKey; patternKeys[i+1] = pKey;
      }
    }

    // Mark resolution: pattern ending on 'V' resolving a 4th up or half step down to I
    for (let i = 0; i < chords.length - 1; i++) {
      if (patterns[i] !== 'V') continue;
      if (patterns[i + 1]) continue;
      const c2 = chords[i], c3 = chords[i + 1];
      if (!c2 || !c3) continue;
      const interval = ((c3.rootIndex - c2.rootIndex) % 12 + 12) % 12;
      if (interval === 5 || interval === 11) {
        patterns[i + 1] = 'I';
        patternKeys[i + 1] = patternKeys[i];
      }
    }

    return { patterns, patternKeys };
  }

  function analyzeVoiceLeading(chord, nextChord, key, pattern) {
    const hints = { approachTones: [], preferDiatonic: true, direction: 0 };
    if (!chord || !nextChord) return hints;

    const interval = ((nextChord.rootIndex - chord.rootIndex) % 12 + 12) % 12;

    // Chromatic approach from below (half step up)
    if (interval === 1) {
      hints.direction = 1;
      hints.approachTones = [((nextChord.rootIndex - 1) % 12 + 12) % 12];
    }
    // Chromatic approach from above (half step down)
    else if (interval === 11) {
      hints.direction = -1;
      hints.approachTones = [((nextChord.rootIndex + 1) % 12 + 12) % 12];
    }
    // Down a 5th (most common jazz resolution)
    else if (interval === 5) {
      hints.direction = -1;
      // Approach from half step above or below the target root
      hints.approachTones = [
        ((nextChord.rootIndex + 1) % 12 + 12) % 12,
        ((nextChord.rootIndex - 1) % 12 + 12) % 12
      ];
    }
    // Down a 4th
    else if (interval === 7) {
      hints.direction = 1;
      hints.approachTones = [((nextChord.rootIndex - 2) % 12 + 12) % 12];
    }

    // Tritone sub: prefer chromatic descent
    if (isTritoneSubstitution(chord, nextChord, key)) {
      hints.direction = -1;
      hints.approachTones = [((nextChord.rootIndex + 1) % 12 + 12) % 12];
      hints.preferDiatonic = false;
    }

    // In a ii-V-I, the V chord approach should strongly target the I root
    if (pattern === 'V') {
      hints.approachTones = [
        ((nextChord.rootIndex + 1) % 12 + 12) % 12,
        ((nextChord.rootIndex - 1) % 12 + 12) % 12
      ];
    }

    return hints;
  }

  function getAvailableScaleTones(rootIndex, quality, key) {
    const cat = qualityCategory(quality);
    const degree = getScaleDegree(rootIndex, key.tonic, key.mode);

    // If chord is diatonic, use the key's scale from this root
    if (degree >= 0) {
      const scale = key.mode === 'major' ? MAJOR_SCALE : MINOR_SCALE;
      return scale.map(interval => (key.tonic + interval) % 12);
    }

    // Non-diatonic chord: use chord tones + chromatic passing tones
    if (cat === 'dom') {
      // Mixolydian from chord root
      return [0, 2, 4, 5, 7, 9, 10].map(i => (rootIndex + i) % 12);
    } else if (cat === 'min') {
      // Dorian from chord root
      return [0, 2, 3, 5, 7, 9, 10].map(i => (rootIndex + i) % 12);
    } else if (cat === 'dim') {
      // Half-whole diminished
      return [0, 1, 3, 4, 6, 7, 9, 10].map(i => (rootIndex + i) % 12);
    }

    // Default: major scale of chord root
    return MAJOR_SCALE.map(i => (rootIndex + i) % 12);
  }

  function analyze(song, roadmapSections) {
    // Extract all chords from parsed song in order, with beat durations
    const chords = [];
    const beats = [];
    for (const line of song.lines) {
      if (line.type !== 'chordline') continue;
      for (const seg of line.segments) {
        if (seg.chord) {
          const parsed = ChordLibrary.parseChord(seg.chord);
          chords.push(parsed);
          beats.push(seg.beats || 1);
        }
      }
    }

    if (chords.length === 0) return [];

    // Detect key per section (handles modulation between sections)
    const sectionKeys = [];
    if (roadmapSections && roadmapSections.length > 0) {
      for (const sec of roadmapSections) {
        const sectionChords = chords.slice(sec.startChord, sec.endChord + 1);
        const sectionBeats = beats.slice(sec.startChord, sec.endChord + 1);
        const key = detectKeyCenter(sectionChords, sectionBeats);
        sectionKeys.push({ start: sec.startChord, end: sec.endChord, key, label: sec.label });
      }
    } else {
      const key = detectKeyCenter(chords, beats);
      sectionKeys.push({ start: 0, end: chords.length - 1, key, label: '' });
    }

    // Detect local modulations within sections (window-based)
    // If a 4-chord window fits a different key much better, mark it as modulation
    const WINDOW = 4;
    const keyAtChord = new Array(chords.length);
    for (const sec of sectionKeys) {
      for (let i = sec.start; i <= sec.end; i++) {
        keyAtChord[i] = sec.key;
      }
      // Check for internal modulations in sections longer than WINDOW*2
      const secLen = sec.end - sec.start + 1;
      if (secLen > WINDOW * 2) {
        for (let i = sec.start + WINDOW; i <= sec.end - WINDOW + 1; i++) {
          const windowChords = chords.slice(i, i + WINDOW);
          const windowBeats = beats.slice(i, i + WINDOW);
          const localKey = detectKeyCenter(windowChords, windowBeats);
          if (localKey.confidence > sec.key.confidence + 0.2 && localKey.tonic !== sec.key.tonic) {
            for (let j = i; j < i + WINDOW && j <= sec.end; j++) {
              keyAtChord[j] = localKey;
            }
          }
        }
      }
    }

    // Handle lone V→I (dom7 resolving down a 5th where V is non-diatonic)
    for (let i = 0; i < chords.length - 1; i++) {
      const c1 = chords[i], c2 = chords[i + 1];
      if (!c1 || !c2) continue;
      const cat1 = qualityCategory(c1.quality);
      if (cat1 !== 'dom') continue;
      const resInterval = ((c2.rootIndex - c1.rootIndex) % 12 + 12) % 12;
      if (resInterval !== 5) continue;
      const degree = getScaleDegree(c1.rootIndex, keyAtChord[i]?.tonic ?? 0, keyAtChord[i]?.mode ?? 'major');
      if (degree < 0) {
        // Non-diatonic dom7 resolving down a 5th — reassign to target key
        const targetKey = { tonic: c2.rootIndex, mode: 'major', confidence: 1 };
        keyAtChord[i] = targetKey;
      }
    }

    // Detect patterns across the full progression (interval-based, key-independent)
    const mainKey = sectionKeys[0]?.key || { tonic: 0, mode: 'major' };
    const { patterns, patternKeys } = detectPatterns(chords);

    // Apply pattern-derived keys (patterns imply their own tonal center)
    for (let i = 0; i < chords.length; i++) {
      if (patternKeys[i]) keyAtChord[i] = patternKeys[i];
    }

    // Build per-chord analysis
    const result = [];
    for (let i = 0; i < chords.length; i++) {
      const chord = chords[i];
      const nextChord = i + 1 < chords.length ? chords[i + 1] : null;
      const key = keyAtChord[i] || mainKey;

      if (!chord) {
        result.push(null);
        continue;
      }

      const degree = getScaleDegree(chord.rootIndex, key.tonic, key.mode);
      // For the last chord, wrap around to the first chord (form repeats)
      const effectiveNext = nextChord || chords[0];
      const isTritSub = isTritoneSubstitution(chord, effectiveNext, key);
      const roman = isTritSub ? 'V7' : romanNumeral(degree, chord.quality, key.mode);
      const isSecDom = isSecondaryDominant(chord, effectiveNext, key);
      const patternRole = patterns[i] || null;
      const voiceLeading = analyzeVoiceLeading(chord, nextChord, key, patternRole);
      const scaleTones = getAvailableScaleTones(chord.rootIndex, chord.quality, key);

      result.push({
        chord,
        key,
        degree,
        roman,
        isSecondaryDominant: isSecDom,
        isTritoneSubstitution: isTritSub,
        patternRole,
        voiceLeading,
        scaleTones
      });
    }

    return result;
  }

  return { analyze, detectKeyCenter, qualityCategory };
})();
